<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7f0019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MUJI 찾기">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>MUJI 제품 찾기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --red: #7f0019;
    --bg: #f7f6f4;
    --card: #ffffff;
    --ink: #1c1c1c;
    --sub: #8a8681;
    --line: #e8e5e1;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 640px; margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .brand h1 { font-size: 17px; letter-spacing: -0.3px; }
  .brand h1 b { color: var(--red); }
  .brand .upd { font-size: 11px; color: var(--sub); }
  .searchwrap { position: relative; }
  #q {
    width: 100%; font-size: 16px; padding: 12px 40px 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink); outline: none;
  }
  #q:focus { border-color: var(--red); }
  #clearq {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; font-size: 18px; color: var(--sub);
    padding: 8px; display: none; cursor: pointer;
  }
  .hint { font-size: 11px; color: var(--sub); margin-top: 6px; }
  main { padding: 12px 16px 60px; }
  .loading { text-align: center; color: var(--sub); padding: 48px 0; font-size: 14px; }

  /* 카테고리 홈 */
  .cat-top {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px;
  }
  .cat-top button {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 12px; font-size: 15px; text-align: left; color: var(--ink); cursor: pointer;
  }
  .cat-top button span { display: block; font-size: 11px; color: var(--sub); margin-top: 3px; }
  .sec-title { font-size: 13px; color: var(--sub); margin: 18px 0 8px; }

  /* 외부 바로가기 (홈 하단) */
  .quicklinks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .quicklinks a {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 10px; font-size: 13px; text-align: center; color: var(--ink); text-decoration: none;
  }
  .dlinks { margin: 14px 0 4px; }

  /* 하위 카테고리 */
  .crumb { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .crumb button.back {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 12px; font-size: 14px; cursor: pointer; color: var(--ink);
  }
  .crumb .path { font-size: 14px; color: var(--sub); }
  .leaf-group { margin-bottom: 14px; }
  .leaf-group h3 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 12px 0 6px; }
  .leaf-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .leaf-list button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 13px; font-size: 13.5px; cursor: pointer;
  }
  .leaf-list button b { color: var(--sub); font-weight: 400; font-size: 12px; }

  /* 제품 그리드 / 검색결과 */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pcard {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    /* 화면 밖 카드는 렌더링을 건너뛰어 긴 목록 스크롤·검색 타이핑이 가벼워진다 */
    content-visibility: auto; contain-intrinsic-size: auto 180px;
  }
  .pcard .ph { aspect-ratio: 1; background: #f0eeeb; display: flex; align-items: center; justify-content: center; }
  /* 사진이 뚝뚝 나타나지 않게: 로딩 완료 시 배경색에서 부드럽게 페이드인 */
  .pcard .ph img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s ease; }
  .pcard .ph img.ld { opacity: 1; }
  .pcard .ph .noimg { font-size: 11px; color: var(--sub); }
  .pcard .nm { font-size: 12px; padding: 7px 8px 2px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
  .pcard .pr { font-size: 12px; color: var(--sub); padding: 0 8px 8px; }
  .soldout-badge { display: inline-block; font-size: 10px; color: #fff; background: #b3aca4; border-radius: 4px; padding: 1px 5px; margin-right: 4px; vertical-align: 1px; }
  .store-badge { display: inline-block; font-size: 10px; color: #fff; background: var(--red); border-radius: 4px; padding: 1px 5px; margin-right: 4px; vertical-align: 1px; }
  .rescount { font-size: 13px; color: var(--sub); margin: 2px 0 10px; }
  .more { width: 100%; margin-top: 12px; padding: 12px; font-size: 14px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; cursor: pointer; color: var(--ink); }
  .empty { text-align: center; color: var(--sub); padding: 40px 12px; font-size: 14px; line-height: 1.6; }

  /* 상세 */
  #detail {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    max-width: 640px; margin: 0 auto; overflow-y: auto;
    padding-bottom: 40px;
    /* display 토글 대신 transform으로 오른쪽에서 밀려 들어오는 전환.
       visibility는 duration 보간(전환 중 visible, 끝나면 hidden)으로 처리 */
    visibility: hidden; transform: translateX(100%);
    transition: transform .22s ease, visibility .22s;
    will-change: transform; /* 슬라이드를 GPU 합성으로 처리해 끊김 방지 */
  }
  #detail.open { visibility: visible; transform: none; }
  .d-head { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 5; }
  .d-head button { border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; color: var(--ink); }
  .d-head span { font-size: 13px; color: var(--sub); }
  .d-body { padding: 16px; }
  .d-imgs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; }
  .d-imgs img { height: 150px; border-radius: 10px; border: 1px solid var(--line); background: #f0eeeb; cursor: zoom-in;
    /* flex-shrink 금지: 사진이 많을 때 눌려서 비율이 왜곡(모델이 홀쭉하게)되는 것 방지 */
    flex: 0 0 auto; min-width: 112px; opacity: 0; transition: opacity .25s ease; }
  .d-imgs img.ld { opacity: 1; }
  .galg { margin-bottom: 10px; }
  .galg .gall { font-size: 11.5px; color: var(--sub); margin: 0 2px 5px; }
  .galg .d-imgs { margin-bottom: 0; }
  .gal-load { font-size: 11.5px; color: var(--sub); margin: 0 2px 12px; }
  .galmore { margin-bottom: 6px; }
  .galg { scroll-margin-top: 64px; }  /* 색상 칩 연동 스크롤 시 sticky 헤더에 안 가리게 */
  .galmore > summary { font-size: 12.5px; color: var(--sub); cursor: pointer; padding: 6px 2px; }
  /* 상세 페이지 이미지(연출컷·설명·규격표) 접기 */
  .dimgs { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
  .dimgs > summary { padding: 12px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .dimgs .dbody { padding: 0 10px 10px; }
  .dimgs .dbody img { width: 100%; border-radius: 8px; display: block; margin-bottom: 8px; background: #fff; }
  /* 사진 크게 보기 */
  #viewer { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.93);
    opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  #viewer.open { opacity: 1; pointer-events: auto; }
  #viewer .vstrip { height: 100%; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
  #viewer .vstrip > div { flex: 0 0 100%; height: 100%; scroll-snap-align: center;
    display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
  #viewer .vstrip img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .vclose { position: absolute; top: 12px; right: 12px; z-index: 2; border: 0; border-radius: 999px;
    width: 42px; height: 42px; font-size: 18px; background: rgba(255,255,255,.92); cursor: pointer; }
  #viewer .vcnt { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .namebox {
    background: var(--card); border: 1.5px solid var(--red); border-radius: 12px;
    padding: 14px; margin-bottom: 8px;
  }
  .namebox .lbl { font-size: 11px; color: var(--red); font-weight: 700; margin-bottom: 5px; }
  .namebox .nm { font-size: 17px; font-weight: 700; line-height: 1.45; word-break: keep-all; user-select: all; }
  .namebox .pr { font-size: 13px; color: var(--sub); margin-top: 5px; }
  .copybtn {
    margin-top: 10px; width: 100%; padding: 11px; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 10px; background: var(--red); color: #fff; cursor: pointer;
  }
  .warn { font-size: 11.5px; color: var(--sub); margin: 8px 2px 16px; line-height: 1.5; }
  .colorblock { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .colorblock .ctitle { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .colorblock .ctitle img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); }
  /* 색상 칩 선택(색상 여러 개인 제품 — 선택한 색상의 사이즈만 아래에 표시) */
  .cchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; -webkit-overflow-scrolling: touch; }
  .cchips button {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 7px 5px; width: 78px; cursor: pointer;
    font-size: 11px; color: var(--ink); flex-shrink: 0;
  }
  .cchips button img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); pointer-events: none; }
  /* 색상명이 길어도 칩 폭은 고정 — 2줄까지 보여주고 말줄임. 전체 이름은 칩 아래 제목 줄에 표시 */
  .cchips button span {
    pointer-events: none; max-width: 100%; line-height: 1.25; text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .cchips button.on { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); font-weight: 700; }
  .cchips .cso { font-size: 10px; color: #b0473a; }
  .bcrow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 2px; border-top: 1px dashed var(--line); gap: 8px;
  }
  .bcrow .sz { font-size: 13.5px; min-width: 44px; }
  .bcrow .sz .st { color: #b0473a; font-size: 11px; }
  .bcrow .bc {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 16.5px; letter-spacing: 0.5px; user-select: all;
  }
  .bcrow button {
    border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
    padding: 7px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink); flex-shrink: 0;
  }
  .d-cats { font-size: 12px; color: var(--sub); margin-top: 14px; line-height: 1.6; }

  /* 제품 상세정보 (제품 코드·소재·규격·원산지 등) */
  .specbox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 2px 14px; margin-bottom: 10px; }
  .spec-row { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .spec-row:first-child { border-top: 0; }
  .spec-k { flex-shrink: 0; width: 64px; color: var(--sub); font-weight: 600; }
  .spec-v { flex: 1; min-width: 0; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; user-select: all; }
  .spec-v.mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 15px; letter-spacing: 0.5px; }
  /* 스펙 표의 재고 행(단일 바코드 제품 — 하단 바코드 블록 대신) */
  .stkrow, .coderow { align-items: center; }
  .spec-row .sbtn {
    border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
    padding: 7px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink); flex-shrink: 0;
  }
  .spec-row .sbtn.stockbtn { color: var(--red); }
  .stkrow .mystk { display: inline; font-size: 13.5px; min-height: 0; color: var(--red); font-weight: 700; }
  .stkrow .mystk.zero { color: var(--sub); font-weight: 400; }
  .mystk.wait { color: var(--sub); font-weight: 400; }
  /* 사용상 주의사항 (스펙 표 아래 접기) */
  .pnotice { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
  .pnotice summary { padding: 12px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .pnotice .nbody { padding: 0 14px 12px; font-size: 13px; line-height: 1.65; color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; white-space: pre-line; }

  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; font-size: 14px; padding: 11px 20px;
    border-radius: 999px; opacity: 0; transition: all .2s; z-index: 99; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { text-align: center; font-size: 11px; color: var(--sub); padding: 24px 16px; line-height: 1.6; }
  /* 관리자 입구: footer 맨 아래 흐린 점 하나(누르는 영역은 넉넉히) */
  footer .adminlink { display: inline-block; padding: 10px 16px; color: var(--line); cursor: pointer; user-select: none; }
  .crumb .edu-lockmark { margin-left: auto; font-size: 15px; opacity: .5;
    border: 0; background: none; padding: 6px 8px; cursor: pointer; }
  /* 본문 화면 전환: 살짝 떠오르는 페이드 */
  @keyframes viewin { from { opacity: 0; transform: translateY(6px); } }
  #main.vin { animation: viewin .16s ease; }
  @media (prefers-reduced-motion: reduce) {
    #main.vin { animation: none; }
    #detail, #detail.open, #viewer, #scanner, #scanner video, #scanresult { transition: none; }
  }

  /* 탭 */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    flex: 1; padding: 9px 0; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--sub);
  }
  .tabs button.on { background: var(--red); border-color: var(--red); color: #fff; }

  /* 교육자료 */
  .edu-card {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 8px; cursor: pointer;
  }
  .edu-card .t { font-size: 15px; font-weight: 700; color: var(--ink); }
  .edu-card .d { font-size: 12.5px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
  .doc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; line-height: 1.7; }
  .doc h2 { font-size: 19px; margin: 4px 0 12px; }
  .doc h3 { font-size: 15.5px; margin: 18px 0 8px; color: var(--red); }
  .doc h4 { font-size: 14px; margin: 14px 0 6px; }
  .doc p { font-size: 14px; margin: 8px 0; }
  .doc ul, .doc ol { font-size: 14px; padding-left: 22px; margin: 8px 0; }
  .doc li { margin: 4px 0; }
  .doc li.chk { list-style: none; margin-left: -20px; }
  .doc blockquote { border-left: 3px solid var(--line); padding: 2px 12px; color: var(--sub); font-size: 13px; margin: 10px 0; }
  .doc hr { border: 0; border-top: 1px dashed var(--line); margin: 16px 0; }
  .doc-img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line);
    border-radius: 8px; margin: 12px 0; }
  .doc-img-sm { display: block; max-width: 220px; width: 100%; height: auto; border: 1px solid var(--line);
    border-radius: 8px; margin: 8px 0; }
  .doc-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
  .doc-table th, .doc-table td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
  .doc-table th { background: var(--bg); font-weight: 700; }
  .doc-plink { color: var(--red); font-weight: 600; text-decoration: none;
    border-bottom: 1px solid var(--red); cursor: pointer; }
  .doc-link { color: var(--red); }
  .doc-table td .doc-plink { white-space: nowrap; }
  .doc-code { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px;
    letter-spacing: 0.3px; user-select: all; }
  .doc-prow { display: flex; align-items: center; gap: 11px; padding: 8px 2px;
    border-top: 1px dashed var(--line); cursor: pointer; }
  .doc-prow:active { background: var(--bg); }
  .doc-prow img, .doc-prow-noimg { width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 8px; border: 1px solid var(--line); object-fit: cover; background: #f0eeeb; }
  .doc-prow-tx { min-width: 0; }
  .doc-prow-nm { font-size: 13.5px; line-height: 1.35; color: var(--ink); font-weight: 600; }
  .doc-prow .doc-code { color: var(--sub); font-size: 12px; }
  .doc-prow-pr { color: var(--sub); font-family: inherit; }

  /* 접기 블록 */
  .doc-fold { border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; background: var(--card); }
  .doc-fold > summary { padding: 13px 14px; font-size: 15px; font-weight: 700; color: var(--ink);
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
  .doc-fold > summary::before { content: "▸"; color: var(--red); font-size: 13px; transition: transform .15s; }
  .doc-fold[open] > summary::before { transform: rotate(90deg); }
  .doc-fold > summary::-webkit-details-marker { display: none; }
  .doc-fold-body { padding: 0 14px 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .doc-table td { line-height: 1.5; }

  /* 교육자료 카테고리 */
  .edu-group { margin-bottom: 6px; }
  .edu-cat { font-size: 12.5px; color: var(--red); font-weight: 700; margin: 16px 2px 7px;
    display: flex; align-items: center; gap: 6px; }
  .edu-cat::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .edu-cat b { font-weight: 400; color: var(--sub); font-size: 11.5px; }

  /* 교육자료 검색 */
  .edu-search { width: 100%; font-size: 15px; padding: 10px 12px; border: 1.5px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink); outline: none; margin-bottom: 10px; }
  .edu-search:focus { border-color: var(--red); }

  /* 교육자료 편집 */
  .edu-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .edu-adminchip { margin-left: auto; border: 1px solid var(--line); background: var(--card); color: var(--sub);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; cursor: pointer; }
  .edu-add { border: 1px solid var(--red); background: var(--red); color: #fff; border-radius: 10px;
    padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .crumb .edu-edit { margin-left: auto; border: 1px solid var(--line); background: var(--card); color: var(--red);
    border-radius: 10px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }

// JSON 파싱 — 모델이 군더더기를 붙이거나 따옴표 이스케이프를 빠뜨려도 최대한 건진다
function parseAIJson(txt) {
  try { return JSON.parse(txt); } catch (e) {}
  const s = txt.indexOf("{"), t = txt.lastIndexOf("}");
  if (s >= 0 && t > s) { try { return JSON.parse(txt.slice(s, t + 1)); } catch (e) {} }
  // 최후: 알려진 세 필드(title·desc·body)를 직접 발라낸다
  const un = v => v.replace(/\\n/g, "\n").replace(/\\t/g, "\t").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
  const grab = (key, nextKey) => {
    const m = txt.match(new RegExp('"' + key + '"\\s*:\\s*"([\\s\\S]*?)"\\s*,\\s*"' + nextKey + '"'));
    return m ? un(m[1]) : "";
  };
  const title = grab("title", "desc") || grab("title", "body");
  const desc = grab("desc", "body");
  const bm = txt.match(/"body"\s*:\s*"([\s\S]*)"\s*\}?\s*$/);
  const body = bm ? un(bm[1]) : "";
  if (!body) throw new Error("empty");
  return { title, desc, body };
}

    parts.push({ inlineData: { mimeType: "image/jpeg", data: p.split(",")[1] } });
  });

    try {
      const model = aiMod.getGenerativeModel(ai, { model: m, generationConfig: { responseMimeType: "application/json" } });

        const res = await model.generateContentStream(parts);
        let acc = "";
        for await (const ch of res.stream) {
          try { acc += ch.text(); } catch (e2) {}
          onLive(acc);
        }
        txt = (await res.response).text();
      } else {
        const r = await model.generateContent(parts);
        txt = r.response.text();
      }
      try { return parseAIJson(txt); }
      catch (pe) { lastErr = new Error("응답 형식 오류"); continue; }  // 형식이 깨지면 다음 모델로 재시도
    } catch (e) {
      lastErr = e;
      // 모델이 없거나(404) 그 모델의 무료 한도가 찼으면(429) 다음 모델로.
      // 그 외(네트워크·App Check 등)는 바로 알린다.
      if (!/not[ _-]?found|404|unsupported|unknown model|quota|resource.?exhausted|429/i.test(String(e.message))) throw e;
    }

}
// 스트리밍 중간 JSON에서 사람이 읽을 수 있는 부분만 추출해 보여준다
function aiLiveText(acc) {
  const g = k => {
    const m = acc.match(new RegExp('"' + k + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)'));
    return m ? m[1].replace(/\\n/g, "\n").replace(/\\"/g, '"').replace(/\\\\/g, "\\") : null;
  };
  const t = g("title"), d = g("desc"), b = g("body");
  let out = "";
  if (t) out += "제목: " + t + "\n";
  if (d) out += "설명: " + d + "\n";
  if (b) out += "\n" + b;
  return out || "생각하는 중…";
}
// AI 본문에 i번째 사진을 배치. ① 자리 표시({{사진1}} 외에 [사진1]·(사진 1) 등 변형도 인식) 자리에,
// ② 자리 표시가 없으면 i번째 소제목 바로 아래(사진은 대개 섹션 순서와 일치), ③ 그것도 없으면 맨 뒤에.
function placeAIPhoto(body, i, md) {
  const tok = new RegExp("[{\\[(<]{1,2}\\s*(?:사진|이미지|photo|image)\\s*" + (i + 1) + "\\s*[}\\])>]{1,2}", "i");
  const lines = body.split("\n");
  for (let li = 0; li < lines.length; li++) {
    if (!tok.test(lines[li])) continue;
    const rest = lines[li].replace(tok, " ").trim();
    if (/^[-*>·:,.()\s]*$/.test(rest)) lines[li] = md;              // 자리 표시뿐인 줄 → 통째로 교체
    else { lines[li] = lines[li].replace(tok, "").trimEnd(); lines.splice(li + 1, 0, md); }  // 문장 속 언급 → 그 줄 아래 삽입
    return lines.join("\n");
  }
  let count = 0;
  for (let li = 0; li < lines.length; li++) {
    if (!/^#{1,3}\s+/.test(lines[li])) continue;
    if (count === i) { lines.splice(li + 1, 0, md); return lines.join("\n"); }
    count++;
  }
  return body + "\n\n" + md;
}

function eduAIPickDocs() {

async function readAIDoc(f) {
  const name = f.name || "문서";
  if (/\.(txt|md)$/i.test(name) || /^text\//.test(f.type || "")) {
    const text = await f.text();
    if (text.length > 400000) throw new Error(name + ": 문서가 너무 깁니다(40만 자 이내)");
    return { name, text };
  }
  if (/\.pdf$/i.test(name) || f.type === "application/pdf") {
    if (f.size > 10 * 1024 * 1024) throw new Error(name + ": PDF는 10MB까지 첨부할 수 있습니다");
    const buf = await f.arrayBuffer();
    return { name, mime: "application/pdf", data: b64(buf) };
  }
  throw new Error("PDF 또는 텍스트 파일만 첨부할 수 있어요 (워드 파일은 PDF로 저장한 뒤 첨부)");
}

async function loadEdu(key) {
  const { db, fs } = await initFirebase();
  const snap = await fs.getDocs(fs.query(fs.collection(db, "edu"), fs.orderBy("order")));
  const out = [];
  for (const d of snap.docs) {
    const data = d.data();
    try {
      const dec = await decryptObj(key, data);  // { title, desc, body } 또는 { type:"img", ... }
      if (dec.type === "img") continue;         // 분리 저장 이미지는 목록에서 숨김
      if (dec.del) continue;                    // 소프트 삭제된 문서(하드 삭제는 보안 규칙이 금지)
      out.push({ id: d.id, order: data.order, ...dec });
    } catch (e) {
      out.push({ id: d.id, order: data.order, title: "🔒 열 수 없음", desc: "현재 비밀번호로 복호화 안 됨", body: "", _locked: true });

const EIMG_CACHE = {};
async function hydrateEduImages(root, skipFolded) {
  let imgs = [...(root || document).querySelectorAll("img[data-eimg]")];
  if (skipFolded) imgs = imgs.filter(el => !el.closest(".doc-fold") || el.closest(".doc-fold").open);
  if (!imgs.length) return;
  const key = await ensureEduKey();
  if (!key) return;
  const { db, fs } = await initFirebase();
  for (const el of imgs) {
    const id = el.getAttribute("data-eimg");
    el.removeAttribute("data-eimg");
    try {
      if (!EIMG_CACHE[id]) {
        const snap = await fs.getDoc(fs.doc(db, "edu", id));
        if (!snap.exists()) continue;
        const dec = await decryptObj(key, snap.data());
        EIMG_CACHE[id] = dec.src;
      }
      el.src = EIMG_CACHE[id];
    } catch (e) {}
  }
}

let eduKey = null;  // 유도된 AES-GCM 키(메모리 캐시)
async function sha256hex(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function eduAuthed() { return !!sessionStorage.getItem("eduPw"); }
async function deriveKey(password) {
  const e = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", e.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: e.encode("muji-edu-salt-v1"), iterations: 100000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function ensureEduKey() {
  if (eduKey) return eduKey;
  const pw = sessionStorage.getItem("eduPw");
  if (!pw) return null;
  eduKey = await deriveKey(pw);
  return eduKey;
}
function b64(buf) {
  // 큰 데이터(이미지 포함 문서)에서 스택 초과 방지 위해 청크 단위로 변환
  const bytes = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}
function ub64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer; }
async function encryptObj(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { enc: b64(ct), iv: b64(iv) };
}
async function decryptObj(key, doc) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(doc.iv) }, key, ub64(doc.enc));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- 한글 유틸 ---------- */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function chosung(str) {
  let out = "";
  for (const ch of str) {
    const c = ch.codePointAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) out += CHO[Math.floor((c - 0xAC00) / 588)];
    else out += ch;
  }
  return out;
}
// 검색 비교용 정규화: 공백·중점(ㆍ·・ 세 종류 모두)·괄호류 제거 + 소문자
function norm(str) {
  return (str || "").toLowerCase().replace(/[\sㆍ·・()\[\]\-_,./]/g, "");
}
function isChosungQuery(s) { return /^[ㄱ-ㅎ]+$/.test(s); }

// products.json(온라인 수집) + extra.json(매장 전용 수동 등록)을 함께 읽어 합친다.
Promise.all([
  fetch("./data/products.json").then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  fetch("./data/extra.json").then(r => r.ok ? r.json() : []).catch(() => []),
]).then(([db, extra]) => init(db, extra))
  .catch(e => {
    $main.innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.<br>' + e + "</div>";
  });

// extra.json의 간단한 항목을 앱 내부 제품 구조로 변환
function extraToProduct(item, i) {
  const bc = (item.barcode || "").trim();
  return {
    id: "x" + i,
    name: item.name || "(이름 없음)",
    price: item.price || null,
    state: "ON",
    cats: [item.cat && item.cat.trim() ? item.cat.trim() : "매장 전용 상품"],
    colors: [{
      color: "단품", img: null, imgs: [],
      sizes: bc ? [{ size: "", barcode: bc, state: "ON" }] : [],
    }],
    storeOnly: true,
  };
}

function init(db, extra) {
  DB = db;
  const extraProducts = (Array.isArray(extra) ? extra : []).map(extraToProduct);
  const allProducts = db.products.concat(extraProducts);
  const totalCount = db.count + extraProducts.length;
  document.getElementById("upd").textContent = db.updated + " 기준 · " + totalCount.toLocaleString() + "개";
  PRODUCTS = allProducts.map(p => {
    const barcodes = [];
    for (const c of p.colors) for (const s of c.sizes) barcodes.push(s.barcode);
    return {
      ...p,
      _n: norm(p.name),
      _c: chosung(norm(p.name)),
      _b: barcodes.join(" "),
      _k: ((p.spec || {})["제품 코드"] || "").toLowerCase(),  // 제품 코드·수입 품번(예: AC24HA6A) 검색용
      _img: firstImg(p),
    };
  });
  buildCatTree();
  route();
  // 스캐너 라이브러리(구형 360KB + 신형 wasm 975KB)를 한가할 때 미리 받아둔다 → 첫 스캔부터 빠르게
  if (navigator.mediaDevices && window.isSecureContext) {
    setTimeout(() => { loadZxing().catch(() => {}); loadZxingWasm(); }, 2500);
  }
  // PWA: 서비스 워커 등록(오프라인 캐시 — 앱 셸·데이터·본 사진). 실패해도 앱 동작엔 영향 없음.
  if ("serviceWorker" in navigator) {
    setTimeout(() => navigator.serviceWorker.register("./sw.js").catch(() => {}), 1500);
  }
}
function firstImg(p) {
  // 실제 제품 사진(imgs)을 우선하고, 없을 때만 색상 칩(img·원단 확대컷)을 쓴다
  for (const c of p.colors) if (c.imgs && c.imgs[0]) return c.imgs[0];
  for (const c of p.colors) if (c.img) return c.img;
  return null;
}
function buildCatTree() {
  CATTREE = {};
  for (const p of PRODUCTS) {
    for (const cat of p.cats) {
      const parts = cat.split(" > ");
      const top = parts[0] || "기타";
      const mid = parts.length >= 3 ? parts[1] : (parts[1] || "전체");
      if (!CATTREE[top]) CATTREE[top] = {};
      if (!CATTREE[top][mid]) CATTREE[top][mid] = {};
      if (!CATTREE[top][mid][cat]) CATTREE[top][mid][cat] = 0;
      CATTREE[top][mid][cat]++;
    }
  }
}

  if (s.view === "leaf") { renderLeaf(s.leaf); return; }
  if ($q.value.trim()) { renderSearch($q.value); return; }
  renderHome();
}

function renderEduList() {
  setTab("edu");
  ensureEduKey().then(key => {
    if (!key) { renderEduPw("list"); return; }
    const render = docs => {
      const head = '<div class="edu-head"><div class="sec-title" style="margin:0">교육자료</div>' +
        // 관리자 모드일 때만 보이는 상태 버튼 — 누르면 관리자 화면(끄기 버튼 있음)으로
        '<button class="edu-add" onclick=\'nav({view:"eduedit",id:""})\'>+ 새 자료</button></div>' +
        (docs.length ? '<input class="edu-search" id="eduSearch" type="search" placeholder="교육자료 검색 (제목·내용)" autocomplete="off">' : '');
      $main.innerHTML = head + '<div id="eduListArea"></div>' +
        '<footer>🔒 내용은 암호화되어 저장됩니다. 비밀번호를 아는 직원만 열람·편집할 수 있어요.' +
        (isAdmin() ? '<br><button class="edu-adminchip" style="margin-top:9px" onclick=\'nav({view:"admin"})\'>🔓 관리자 켜짐</button>' : '') +
        '</footer>';
      const area = document.getElementById("eduListArea");
      const card = d => `<button class="edu-card" onclick='nav({view:"edudoc",id:${JSON.stringify(d.id)}})'>
          <div class="t">${esc(d.title)}</div><div class="d">${esc(d.desc || "")}</div></button>`;
      const drawCards = q => {
        const nq = norm(q);
        // 제목·설명·본문 전체에서 검색(공백 무시). 본문까지 뒤져 원하는 내용 바로 찾기.
        const list = nq ? docs.filter(d => norm(d.title + " " + (d.desc || "") + " " + (d.body || "")).includes(nq)) : docs;
        if (!docs.length) { area.innerHTML = '<div class="empty">아직 등록된 자료가 없습니다.<br>오른쪽 위 “+ 새 자료”로 추가해 주세요.</div>'; return; }
        if (!list.length) { area.innerHTML = '<div class="empty">"' + esc(q.trim()) + '" 검색 결과가 없습니다.</div>'; return; }
        // 카테고리(cat)별로 묶어서 표시. 검색 중에는 묶지 않고 결과만 나열.
        if (nq) { area.innerHTML = list.map(card).join(""); return; }
        const groups = [];
        for (const d of list) {
          const c = (d.cat || "").trim() || "기타";
          let g = groups.find(x => x.cat === c);
          if (!g) { g = { cat: c, items: [] }; groups.push(g); }
          g.items.push(d);
        }
        area.innerHTML = groups.map(g =>
          `<div class="edu-group"><h3 class="edu-cat">${esc(g.cat)} <b>${g.items.length}</b></h3>${g.items.map(card).join("")}</div>`
        ).join("");
      };
      const se = document.getElementById("eduSearch");
      if (se) se.addEventListener("input", () => drawCards(se.value));
      drawCards("");
      window.scrollTo(0, 0);
    };
    // 캐시가 있으면 즉시 그리고(탭 전환이 바로바로), 뒤에서 새로고침해 남이 고친 내용만 반영
    const sig = docs => JSON.stringify(docs.map(d => [d.id, d.title, d.desc, d.cat, d.order]));
    if (EDU) {
      const before = sig(EDU);
      render(EDU);
      loadEdu(key).then(docs => {
        const se = document.getElementById("eduSearch");
        if ((history.state || {}).view === "edu" && sig(docs) !== before && !(se && se.value)) render(docs);
      }).catch(() => {});
      return;
    }
    $main.innerHTML = '<div class="loading">교육자료 불러오는 중…</div>';
    loadEdu(key).then(render).catch(e => {
      $main.innerHTML = '<div class="empty">교육자료를 불러오지 못했습니다.<br>인터넷 연결을 확인해 주세요.<br><span style="font-size:11px">' + esc(String(e)) + '</span></div>';
    });
  });
}
function renderEduDoc(id) {
  setTab("edu");
  ensureEduKey().then(key => {
    if (!key) { renderEduPw("list"); return; }
    const draw = d => {
      // 잠금 문서는 관리자 모드에서만 편집 버튼 노출. 🔒를 누르면 관리자 로그인으로.
      const editBtn = (!d.lock || isAdmin())
        ? `<button class="edu-edit" onclick='nav({view:"eduedit",id:${JSON.stringify(id)}})'>편집</button>`
        : `<button class="edu-lockmark" onclick='nav({view:"admin"})' title="관리자만 수정할 수 있습니다 (탭하면 관리자 로그인)">🔒</button>`;
      $main.innerHTML = `<div class="crumb"><button class="back" onclick="history.back()">← 목록</button><span class="path">${esc(d.title)}</span>
        ${editBtn}</div>
        <div class="doc">${md2html(d.body || "")}</div>`;
      window.__curEduDocId = id;
      // 상세에 다녀온 경우: 저장해둔 접기·스크롤 상태 복원
      const st = DOC_VIEW[id];
      if (st) {
        delete DOC_VIEW[id];
        const folds = [...$main.querySelectorAll(".doc-fold")];
        folds.forEach((f, i) => { if (st.folds[i]) f.open = true; });
      }
      // 접기 밖 이미지는 즉시, 접힌 섹션 안 이미지는 펼칠 때 로드(데이터 절약)
      hydrateEduImages($main.querySelector(".doc"), true);
      $main.querySelectorAll(".doc-fold").forEach(dt => {
        dt.addEventListener("toggle", () => { if (dt.open) hydrateEduImages(dt); });
      });
      if (st) requestAnimationFrame(() => window.scrollTo(0, st.y));
      else window.scrollTo(0, 0);
    };
    const cached = EDU && EDU.find(x => x.id === id);
    if (cached) { draw(cached); return; }
    $main.innerHTML = '<div class="loading">문서 불러오는 중…</div>';
    loadEdu(key).then(docs => { const d = docs.find(x => x.id === id); d ? draw(d) : renderEduList(); })
      .catch(() => renderEduList());
  });
}

/* ---------- 블록 편집기 (비개발자용 간단 모드) ----------
   내부 저장 형식은 기존 마크다운 그대로(뷰어·기존 문서 호환).
   편집 화면에서만 블록(소제목·글·사진·제품·구분선)으로 오가며,

let EB = [];       // 편집 중인 블록 배열
let EB_SEQ = 0;    // 블록 고유 키(그릴 때마다 부여)

// 마크다운 → 블록. md2html이 인식하는 특수 줄(제목·사진·@p·구분선·표·접기)만 분리하고
// 나머지(목록·인용·체크 포함)는 통째로 "글" 블록에 담는다 — 렌더 결과가 달라지지 않게.
function ebParse(md) {
  const lines = String(md || "").replace(/\r\n/g, "\n").split("\n");
  const blocks = [];
  let text = [];
  const flushText = () => {
    while (text.length && !text[0].trim()) text.shift();
    while (text.length && !text[text.length - 1].trim()) text.pop();
    if (text.length) blocks.push({ t: "p", text: text.join("\n") });
    text = [];
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i], tr = line.trim();
    let m;
    if (/^\+\+\+\s*\S/.test(tr)) {
      // 접기 블록: 닫는 +++까지 통째로 마크다운 블록으로(중첩 지원)
      flushText();
      let depth = 1, j = i + 1;
      for (; j < lines.length && depth > 0; j++) {
        const t2 = lines[j].trim();
        if (/^\+\+\+\s*\S/.test(t2)) depth++;
        else if (/^\+\+\+$/.test(t2)) depth--;
      }
      blocks.push({ t: "md", text: lines.slice(i, j).join("\n"), kind: "접기" });
      i = j - 1;
    } else if (tr.startsWith("|")) {
      flushText();
      let j = i;
      while (j < lines.length && lines[j].trim().startsWith("|")) j++;
      blocks.push({ t: "md", text: lines.slice(i, j).join("\n"), kind: "표" });
      i = j - 1;
    } else if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
      flushText(); blocks.push({ t: "h", n: m[1].length, text: m[2] });
    } else if ((m = line.match(/^!\[([^\]]*)\]\(eimg:([A-Za-z0-9]+)\)\s*$/))) {
      flushText(); blocks.push({ t: "img", alt: m[1], eimg: m[2] });
    } else if ((m = line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/))) {
      flushText(); blocks.push({ t: "img", alt: m[1], url: m[2] });
    } else if ((m = line.match(/^@p\s+(\d{8,14})(?:\s+(.+))?$/))) {
      flushText(); blocks.push({ t: "prod", bc: m[1], name: (m[2] || "").trim() });
    } else if (/^---+$/.test(tr)) {
      flushText(); blocks.push({ t: "hr" });
    } else {
      text.push(line);
    }
  }
  flushText();
  blocks.forEach(b => { b._k = ++EB_SEQ; });
  return blocks;
}
function ebBlockMd(b) {
  const alt = s => String(s || "").replace(/[\[\]()]/g, " ").trim();  // 사진 설명이 문법을 깨지 않게
  if (b.t === "h") return "#".repeat(b.n || 1) + " " + (b.text || "").trim();
  if (b.t === "p" || b.t === "md") return b.text || "";
  if (b.t === "img") {
    if (b._up) return "";
    if (b.eimg) return `![${alt(b.alt)}](eimg:${b.eimg})`;
    return b.url ? `![${alt(b.alt)}](${b.url})` : "";
  }
  if (b.t === "prod") return b.bc ? "@p " + b.bc + (b.name ? " " + b.name : "") : "";
  if (b.t === "hr") return "---";
  return "";
}
function ebSerialize() {
  return EB.map(ebBlockMd).map(s => s.replace(/\s+$/, "")).filter(Boolean).join("\n\n");
}
// 현재 편집 화면의 본문(모드 무관): 마크다운 모드면 textarea, 아니면 블록 직렬화

function ebGrow(el) { el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }
function firstBarcode(p) {
  for (const c of p.colors || []) for (const s of c.sizes || []) if (s.barcode) return s.barcode;
  return "";
}
function ebBlockHtml(b, i) {
  const label = b.t === "md" ? (b.kind ? b.kind + " (마크다운)" : "고급 (마크다운)") : (EB_TYPE_LABEL[b.t] || b.t);
  const head = `<div class="eb-head"><span class="eb-type">${label}</span>` +
    `<button type="button" onclick="ebMove(${b._k},-1)"${i === 0 ? " disabled" : ""} aria-label="위로">▲</button>` +
    `<button type="button" onclick="ebMove(${b._k},1)"${i === EB.length - 1 ? " disabled" : ""} aria-label="아래로">▼</button>` +
    `<button type="button" class="eb-x" onclick="ebDel(${b._k})" aria-label="삭제">✕</button></div>`;
  let body = "";
  if (b.t === "h") {
    body = `<input type="text" data-ebk="${b._k}" data-f="text" value="${esc(b.text || "")}" placeholder="소제목을 쓰세요">`;
  } else if (b.t === "p") {

  } else if (b.t === "md") {
    body = `<textarea data-ebk="${b._k}" data-f="text">${esc(b.text || "")}</textarea>`;
  } else if (b.t === "hr") {
    body = `<div class="eb-hr"><div></div></div>`;
  } else if (b.t === "img") {
    if (b._up) body = `<div class="eb-uploading">📷 사진 올리는 중…</div>`;
    else {
      const src = b.url ? ` src="${esc(b.url)}"` :
        (EIMG_CACHE[b.eimg] ? ` src="${EIMG_CACHE[b.eimg]}"` : ` data-eimg="${esc(b.eimg || "")}"`);
      body = `<div class="eb-img-wrap"><img${src} alt=""></div>
        <div class="eb-img-alt"><input type="text" data-ebk="${b._k}" data-f="alt" value="${esc(b.alt || "")}" placeholder="사진 설명 (선택)"></div>`;
    }
  } else if (b.t === "prod") {
    if (b.bc) {

      const nm = b.name || (prod ? prod.name : "(앱 데이터에 없는 제품)");
      const im = prod && prod._img ? `<img src="${esc(imgUrl(prod._img, 100))}" alt="">` : "";
      body = `<div class="eb-prod-sel">${im}<div class="nm">${esc(nm)}<div class="bc">${esc(b.bc)}</div></div>
        <button type="button" onclick="ebProdClear(${b._k})">바꾸기</button></div>`;
    } else {
      body = `<div class="eb-prod-pick">
        <input type="text" data-ebk="${b._k}" data-f="psearch" placeholder="제품명으로 검색 (예: 파일박스)" autocomplete="off">
        <div class="eb-prod-res" id="ebpr${b._k}"></div></div>`;
    }
  }
  return `<div class="eb-blk">${head}${body}</div>`;
}
function renderBlocks() {
  const list = document.getElementById("ebList");
  if (!list) return;
  list.innerHTML = EB.map(ebBlockHtml).join("");
  // 타이핑 중에는 다시 그리지 않는다(포커스·한글 입력 보호) — 값만 블록에 반영
  list.querySelectorAll("[data-ebk]").forEach(el => {
    const k = Number(el.getAttribute("data-ebk")), f = el.getAttribute("data-f");
    if (f === "psearch") { el.addEventListener("input", () => ebProdSearch(k, el.value)); return; }
    el.addEventListener("input", () => {
      const b = EB[ebFind(k)];
      if (!b) return;
      b[f] = el.value;
      if (el.tagName === "TEXTAREA") ebGrow(el);
      ebChanged();
    });
  });
  list.querySelectorAll("textarea").forEach(ebGrow);
  hydrateEduImages(list);
}
function ebMove(k, dir) {
  const i = ebFind(k), j = i + dir;
  if (i < 0 || j < 0 || j >= EB.length) return;
  [EB[i], EB[j]] = [EB[j], EB[i]];
  renderBlocks(); ebChanged();
}
function ebDel(k) {
  const i = ebFind(k);
  if (i < 0) return;
  const b = EB[i];
  if (b.t !== "hr" && ebBlockMd(b).trim() && !confirm("이 블록을 삭제할까요?")) return;
  EB.splice(i, 1);
  renderBlocks(); ebChanged();
}
function ebAdd(type) {
  if (type === "img") { ebPickImage(); return; }
  const b = { t: type, _k: ++EB_SEQ };
  if (type === "h") { b.n = 1; b.text = ""; }
  if (type === "p") b.text = "";
  if (type === "prod") { b.bc = ""; b.name = ""; }
  EB.push(b);
  renderBlocks(); ebChanged();
  const el = document.querySelector(`#ebList [data-ebk="${b._k}"]`);
  if (el) { el.focus(); el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  else {
    const list = document.getElementById("ebList");
    if (list && list.lastElementChild) list.lastElementChild.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}
function ebProdSet(k, bc) {
  const b = EB[ebFind(k)];
  if (!b) return;
  b.bc = bc; b.name = "";
  renderBlocks(); ebChanged();
}
function ebProdClear(k) {
  const b = EB[ebFind(k)];
  if (!b) return;
  b.bc = ""; b.name = "";

}
function ebProdSearch(k, q) {
  const box = document.getElementById("ebpr" + k);
  if (!box) return;
  const nq = norm(q);
  if (!nq) { box.innerHTML = ""; return; }
  const hits = [];
  for (const p of PRODUCTS) {
    if (!norm(p.name).includes(nq)) continue;
    const bc = firstBarcode(p);
    if (!bc) continue;  // 바코드 없는 제품(기프트카드 등)은 카드로 못 넣는다
    hits.push({ p, bc });
    if (hits.length >= 6) break;
  }
  box.innerHTML = hits.length ? hits.map(h =>
    `<button type="button" onclick="ebProdSet(${k},'${h.bc}')">` +
    (h.p._img ? `<img src="${esc(imgUrl(h.p._img, 100))}" loading="lazy" alt="">` : "") +
    `<span class="nm">${esc(h.p.name)}</span></button>`).join("")
    : '<div class="eb-nores">검색 결과가 없습니다</div>';
}
/* 사진 업로드: 기기에서 골라 → 축소·압축 → 암호화해 분리 문서(eimg)로 저장 → 블록에 연결 */
function ebPickImage() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => { if (inp.files && inp.files[0]) ebInsertImageFile(inp.files[0], null); };
  inp.click();
}
// 사진 블록 삽입: afterK 블록 바로 뒤(없으면 맨 뒤)에 업로드 중 상태로 넣고 업로드 시작
function ebInsertImageFile(file, afterK) {
  const b = { t: "img", _k: ++EB_SEQ, _up: true };
  const i = afterK != null ? ebFind(afterK) : -1;
  if (i >= 0) EB.splice(i + 1, 0, b);
  else EB.push(b);
  renderBlocks();
  const pos = i >= 0 ? i + 2 : EB.length;
  const el = document.querySelector("#ebList .eb-blk:nth-child(" + pos + ")");
  if (el) el.scrollIntoView({ block: "center" });
  ebUpload(file, b._k);
}
async function ebUpload(file, k) {
  EB_UP++;
  try {
    const dataUri = await compressEduImage(file);
    const id = await saveEduImage(dataUri);
    const b = EB[ebFind(k)];
    if (!b) return;  // 올리는 사이 블록이 지워짐(문서는 안 쓰인 채 남지만 목록엔 안 보임)
    delete b._up;
    b.eimg = id; b.alt = b.alt || "";
    EIMG_CACHE[id] = dataUri;
    renderBlocks(); ebChanged();
  } catch (e) {
    const i = ebFind(k);
    if (i >= 0) { EB.splice(i, 1); renderBlocks(); }
    toast("사진 업로드 실패: " + (e && e.message || "오류"));
  } finally { EB_UP--; }
}
// 암호화 후 Firestore 문서 제한(enc<900000자)에 들어가도록 최대 60만 자 데이터URI로 압축
async function compressEduImage(file) {
  let img = null;
  try { img = await createImageBitmap(file); } catch (e) {}
  if (!img) {
    img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("이미지를 읽을 수 없습니다"));
      im.src = URL.createObjectURL(file);
    });
  }
  const W = img.width, H = img.height;
  if (!W || !H) throw new Error("이미지를 읽을 수 없습니다");
  const cv = document.createElement("canvas");
  const ctx = cv.getContext("2d");
  for (const maxSide of [1400, 1100, 900, 700]) {
    const s = Math.min(1, maxSide / Math.max(W, H));
    cv.width = Math.max(1, Math.round(W * s));
    cv.height = Math.max(1, Math.round(H * s));
    ctx.fillStyle = "#fff";                       // PNG 투명 배경 → 흰색
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    for (const q of [0.82, 0.7, 0.58]) {
      const uri = cv.toDataURL("image/jpeg", q);
      if (uri.length <= 600000) return uri;
    }
  }
  throw new Error("사진 용량을 줄이지 못했습니다");
}
async function saveEduImage(dataUri) {
  const key = await ensureEduKey();
  if (!key) throw new Error("비밀번호가 필요합니다");
  const { db, fs } = await initFirebase();
  const encrypted = await encryptObj(key, { type: "img", src: dataUri });
  if (encrypted.enc.length >= 900000) throw new Error("사진이 너무 큽니다");
  const ref = await fs.addDoc(fs.collection(db, "edu"), { ...encrypted, order: 9999, updatedAt: fs.serverTimestamp() });
  return ref.id;
}
/* 마크다운(고급) 모드에서도 같은 방식으로 사진을 넣을 수 있게 */
function mdPickImage() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => { if (inp.files && inp.files[0]) mdInsertImageFile(inp.files[0]); };

async function mdInsertImageFile(file) {
  toast("📷 사진 올리는 중…");
  try {
    const uri = await compressEduImage(file);
    const id = await saveEduImage(uri);
    EIMG_CACHE[id] = uri;
    const ta = document.getElementById("eduBody");
    if (!ta) return;
    const pos = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
    ta.value = ta.value.slice(0, pos) + "\n![사진](eimg:" + id + ")\n" + ta.value.slice(pos);
    autoSaveEduDraft(EB_ID);
    toast("사진이 추가되었습니다");
  } catch (e) { toast("사진 업로드 실패: " + (e && e.message || "오류")); }
}
/* 클립보드 사진 붙여넣기 — 편집 화면에서 복사한 이미지를 붙여넣으면 사진으로 추가.
   AI 설명칸이면 AI 첨부로, 마크다운 모드면 커서 위치에, 블록 모드면 포커스한 블록 아래(없으면 맨 뒤)에. */
document.addEventListener("paste", e => {
  if (!document.getElementById("eduBodyArea")) return;  // 편집 화면에서만
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  let file = null;
  for (const it of items) {
    if (it.kind === "file" && /^image\//.test(it.type)) { file = it.getAsFile(); break; }
  }
  if (!file) return;  // 이미지가 아니면 일반 붙여넣기 그대로
  e.preventDefault();
  if (e.target && e.target.id === "aiDesc") {  // AI 패널: 생성용 첨부로
    if (AI_PHOTOS.length >= AI_MAX_PHOTOS) { toast("사진은 최대 " + AI_MAX_PHOTOS + "장까지 첨부됩니다"); return; }
    compressEduImage(file)
      .then(u => {
        if (aiAttachedSize() + u.length > AI_BUDGET) { toast("첨부 용량 한도에 도달했습니다 (사진·문서 합계)"); return; }
        AI_PHOTOS.push(u); eduAIThumbs(); toast("사진이 첨부되었습니다");
      })
      .catch(() => toast("사진을 읽지 못했습니다"));
    return;
  }
  if (document.getElementById("eduBody")) { mdInsertImageFile(file); return; }
  const blk = e.target && e.target.closest ? e.target.closest("[data-ebk]") : null;
  ebInsertImageFile(file, blk ? Number(blk.getAttribute("data-ebk")) : null);
});

async function saveEdu(id) {
  const title = document.getElementById("eduTitle").value.trim();
  const desc = document.getElementById("eduDesc").value.trim();
  const cat = document.getElementById("eduCat").value.trim();
  const body = getEduBody();
  const order = Number(document.getElementById("eduOrder").value) || 10;
  if (!title) { toast("제목을 입력하세요"); return; }
  if (!body.trim()) { toast("내용을 입력하세요"); return; }
  if (EB_UP > 0) { toast("사진 업로드가 끝날 때까지 잠깐만 기다려 주세요"); return; }
  const key = await ensureEduKey();
  if (!key) { toast("비밀번호가 필요합니다"); renderEduPw("list"); return; }
  // 잠금 문서는 관리자만 저장 가능. 잠금 여부는 암호화 내용에 포함(관리자 체크박스 또는 기존 값 유지).
  const server = (EDU || []).find(x => x.id === id);
  if (server && server.lock && !isAdmin()) { toast("🔒 관리자만 수정할 수 있는 자료입니다"); return; }
  const lockEl = document.getElementById("eduLock");
  const lock = lockEl ? lockEl.checked : !!(server && server.lock);
  try {
    const { db, fs } = await initFirebase();
    const encrypted = await encryptObj(key, lock ? { title, desc, cat, body, lock: true } : { title, desc, cat, body });  // 내용 암호화
    const data = { ...encrypted, order, updatedAt: fs.serverTimestamp() };
    if (id) await fs.setDoc(fs.doc(db, "edu", id), data);
    else await fs.addDoc(fs.collection(db, "edu"), data);
    localStorage.removeItem(eduDraftKey(id));  // 정식 저장됐으니 임시저장 정리
    EDU = null;
    toast("저장되었습니다");
    history.back();
  } catch (e) {
    toast("저장 실패: " + (e && e.code || "오류"));
  }
}
async function deleteEdu(id) {
  const server = (EDU || []).find(x => x.id === id);
  if (server && server.lock && !isAdmin()) { toast("🔒 관리자만 삭제할 수 있는 자료입니다"); return; }
  if (!confirm("이 교육자료를 삭제할까요? 되돌릴 수 없습니다.")) return;
  try {
    // 소프트 삭제: 보안 규칙이 하드 삭제를 금지하므로(외부인의 문서 파괴 방지),
    // 내용을 유지한 채 del 표시만 붙여 저장한다. 목록에선 사라지고, 필요 시 DB에서 복구 가능.
    const key = await ensureEduKey();
    if (!key) { toast("비밀번호가 필요합니다"); return; }
    const { db, fs } = await initFirebase();
    const payload = server
      ? { title: server.title, desc: server.desc, cat: server.cat, body: server.body, ...(server.lock ? { lock: true } : {}), del: true }
      : { del: true };
    const encrypted = await encryptObj(key, payload);
    await fs.setDoc(fs.doc(db, "edu", id), { ...encrypted, order: (server && Number(server.order)) || 999, updatedAt: fs.serverTimestamp() });
    EDU = null;
    toast("삭제되었습니다");
    history.pushState({ view: "edu" }, "", "#"); route();
  } catch (e) {
    toast("삭제 실패: " + (e && e.code || "오류"));
  }
}
// 최소한의 마크다운 변환: 제목/목록/체크리스트/인용/굵게/구분선/링크
// 링크는 두 가지: [이름](p:바코드) = 앱 안에서 제품 상세 열기, [이름](https://…) = 새 탭
function md2html(src) {
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(p:(\d{8,14})\)/g,
      '<a class="doc-plink" href="#" onclick="openByBarcode(\'$2\');return false;">$1</a>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a class="doc-link" href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let html = "", list = null, para = [], table = [], foldDepth = 0;
  const flushPara = () => { if (para.length) { html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const flushList = () => { if (list) { html += "</" + list + ">"; list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|?[\s|:\-]+\|?$/.test(r));  // 구분선(|---|) 제외
    let h = '<table class="doc-table">';
    rows.forEach((row, i) => {
      const cells = row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const tag = i === 0 ? "th" : "td";
      h += "<tr>" + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
    });
    html += h + "</table>"; table = [];
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushAll(); continue; }
    if (line.trim().startsWith("|")) { flushPara(); flushList(); table.push(line.trim()); continue; }
    if (table.length) flushTable();
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
      flushPara(); flushList();
      const tag = ["h2", "h3", "h4"][m[1].length - 1];
      html += `<${tag}>${inline(m[2])}</${tag}>`;
    } else if (/^---+$/.test(line.trim())) {
      flushPara(); flushList(); html += "<hr>";
    } else if ((m = line.match(/^@p\s+(\d{8,14})(?:\s+(.+))?$/))) {
      // 제품 행: "@p 바코드 [표시이름]" → 썸네일+이름+코드 카드(누르면 상세).
      // 표시이름을 주면 공통 접두를 뺀 짧은 이름으로 보여줄 수 있다(정식 명칭은 상세에서).
      flushPara(); flushList();
      const bc = m[1];
      const prod = (typeof PRODUCTS !== "undefined") &&
        PRODUCTS.find(x => x.colors.some(c => c.sizes.some(s => s.barcode === bc)));
      const nm = (m[2] || "").trim() || (prod ? prod.name : "(앱 데이터에 없는 제품)");
      const im = prod && prod._img ? `<img src="${esc(imgUrl(prod._img, 100))}" loading="lazy" alt="">` : '<span class="doc-prow-noimg"></span>';
      const pr = prod && prod.price ? ` · ${prod.price.toLocaleString()}원` : "";
      html += `<div class="doc-prow" onclick="openByBarcode('${bc}')">${im}
        <div class="doc-prow-tx"><div class="doc-prow-nm">${esc(nm)}</div><div class="doc-code">${bc}<span class="doc-prow-pr">${pr}</span></div></div></div>`;
    } else if ((m = line.match(/^\+\+\+\s*(.*)$/))) {
      // 접기 블록: "+++ 제목"으로 열고 "+++" 단독 줄로 닫는다. 긴 문서를 최소화해 보여줄 때 사용
      flushAll();
      if (m[1].trim()) { html += `<details class="doc-fold"><summary>${inline(m[1].trim())}</summary><div class="doc-fold-body">`; foldDepth++; }
      else if (foldDepth > 0) { html += "</div></details>"; foldDepth--; }
      // 열린 접기가 없는데 "+++"만 오면 무시(잘못된 닫는 태그 출력 방지)
    } else if ((m = line.match(/^!\[([^\]]*)\]\(eimg:([A-Za-z0-9]+)\)\s*$/))) {
      // 분리 저장된 암호화 이미지: 본문 크기 제한을 피해 별도 문서에 담긴 이미지를 지연 로드
      flushPara(); flushList();
      html += `<img class="doc-img" data-eimg="${esc(m[2])}" alt="${esc(m[1])}">`;
    } else if ((m = line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/))) {
      // 이미지 한 줄: ![설명](url). alt가 "sm:"로 시작하면 작은 참고 이미지
      flushPara(); flushList();
      const sm = m[1].startsWith("sm:");
      html += `<img class="${sm ? "doc-img-sm" : "doc-img"}" src="${esc(m[2])}" alt="${esc(m[1].replace(/^sm:/, ""))}" loading="lazy">`;
    } else if ((m = line.match(/^>\s?(.*)/))) {
      flushPara(); flushList(); html += "<blockquote>" + inline(m[1]) + "</blockquote>";
    } else if ((m = line.match(/^[-*]\s+\[( |x|X)\]\s+(.*)/))) {
      flushPara(); if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; }
      const box = m[1].trim() ? "☑" : "☐";
      html += `<li class="chk">${box} ${inline(m[2])}</li>`;
    } else if ((m = line.match(/^[-*]\s+(.*)/))) {
      flushPara(); if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; }
      html += "<li>" + inline(m[1]) + "</li>";
    } else if ((m = line.match(/^\d+\.\s+(.*)/))) {
      flushPara(); if (list !== "ol") { flushList(); html += "<ol>"; list = "ol"; }
      html += "<li>" + inline(m[1]) + "</li>";
    } else {
      flushList(); para.push(line);
    }
  }
  flushAll();
  while (foldDepth-- > 0) html += "</div></details>";  // 닫지 않은 접기 자동 마감
  return html;
}

function doSearch(qRaw) {
  // 공백으로 나눈 단어들을 모두 포함(AND)하는 제품을 찾는다.
  // 단어별로: 숫자 → 바코드, 초성만 → 초성 매칭, 그 외 → 제품명(공백 무시) 매칭
  const tokens = qRaw.trim().split(/\s+/).map(norm).filter(Boolean);
  if (!tokens.length) return [];
  const results = [];
  for (const p of PRODUCTS) {
    let score = 0, ok = true;
    for (const t of tokens) {
      let idx;
      if (/^\d{4,}$/.test(t)) idx = p._b.indexOf(t);
      else if (isChosungQuery(t)) idx = p._c.indexOf(t);
      else if (/^[a-z0-9]{4,}$/.test(t) && /[a-z]/.test(t) && /\d/.test(t)) {
        // 영문+숫자 조합 → 수입 품번/제품 코드 우선, 없으면 제품명
        idx = p._k.indexOf(t);
        if (idx < 0) idx = p._n.indexOf(t);
      } else idx = p._n.indexOf(t);
      if (idx < 0) { ok = false; break; }
      score += idx;
    }
    if (ok) results.push([score, p]);
  }
  results.sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length);
  return results.map(r => r[1]);
}

/* ---------- 외부 바로가기 링크 ----------
   ※ MUJI KR 앱(com.muji) 자동 실행은 불가 — 앱에 외부 진입용 딥링크(browsable intent filter,
   assetlinks.json)가 전혀 없어 intent·커스텀 스킴이 어떤 환경에서도 앱을 못 연다(2026-08-19 실기기 확인).
   그래서 전부 온라인몰 웹으로 연결한다(앱과 내용 동일). */
// 네이버 스토어 검색어 정리: 특수문자나 숫자 치수(예: 225~250)가 섞이면 검색이 안 됨(2026-08-19 사용자 확인)
// → 특수문자는 공백으로, 숫자가 든 토큰(치수·규격류)은 통째로 제거. 전부 지워지면 특수문자만 뺀 원본 사용.
// 가구 등 제품명 끝에 색상이 붙은 경우(예: "… 소파 1인용 베이지/브라운")도 검색이 안 됨
// → 그 제품의 색상명(colors)과 일치하는 꼬리 단어를 제거(끝에서부터만, 최소 1단어는 남김).
function naverQuery(name, colors) {
  const base = name.replace(/[^0-9A-Za-z가-힣ㄱ-ㅎ\s]/g, " ");
  const words = base.split(/\s+/).filter(w => w && !/\d/.test(w));
  const cset = new Set();
  for (const c of colors || [])
    for (const t of (c.color || "").split(/[^0-9A-Za-z가-힣]+/)) if (t) cset.add(t);
  while (words.length > 1 && cset.has(words[words.length - 1])) words.pop();
  return words.length ? words.join(" ") : base.replace(/\s+/g, " ").trim();
}

let gridLimit = 60, lastLeaf = null;
function renderLeaf(leaf) {
  if (leaf !== lastLeaf) { gridLimit = 60; lastLeaf = leaf; }  // 다른 카테고리로 오면 초기화
  const items = PRODUCTS.filter(p => p.cats.includes(leaf));
  const label = leaf.split(" > ").join(" › ");
  let html = `<div class="crumb"><button class="back" onclick="history.back()">← 뒤로</button><span class="path">${esc(label)}</span></div>`;
  html += `<div class="rescount">${items.length}개</div>`;
  html += grid(items, gridLimit, `renderLeafMore(${esc(JSON.stringify(leaf))})`);
  $main.innerHTML = html;
  window.scrollTo(0, 0);
}
window.renderLeafMore = leaf => {
  const items = PRODUCTS.filter(p => p.cats.includes(leaf));

  gridLimit += 60;
};

let searchLimit = 60, lastQuery = null;
function renderSearch(qRaw) {
  if (qRaw !== lastQuery) { searchLimit = 60; lastQuery = qRaw; }
  const items = doSearch(qRaw);
  let html = `<div class="rescount">"${esc(qRaw.trim())}" 검색결과 ${items.length}개</div>`;
  const q = qRaw.trim();
  const codeLike = /^[A-Za-z0-9]{6,}$/.test(q) && /[A-Za-z]/.test(q) && /\d/.test(q);
  if (!items.length) {
    if (codeLike) {
      html += '<div class="empty" id="codewait">수입 품번으로 온라인몰 검색 중…</div>';
      searchCodeOnline(qRaw);
    } else {
      html += '<div class="empty">검색 결과가 없습니다.<br>단어를 줄여서 검색해 보세요. (예: "의류케이스" → "케이스")<br>온라인몰에 없는 매장 전용 상품일 수도 있습니다.</div>';
    }
  } else {
    html += grid(items, searchLimit, "renderSearchMore()");
  }
  $main.innerHTML = html;
}
// 수입 품번(예: AC24HA6A)이 로컬 데이터에 없을 때 온라인몰 키워드 검색으로 보충
// (search_keyword가 품번 검색을 지원함 — 데이터 갱신 전 제품도 찾아진다)
async function searchCodeOnline(qRaw) {
  let hits = [];
  try {
    const res = await fetch(`${MUJI_API}/products/search/list?display_size=20&exclude_soldout=0&page=1&search_keyword=${encodeURIComponent(qRaw.trim())}`,
      { headers: { Accept: "application/json" } });
    const rows = (((await res.json()).data || {}).rows || []);
    hits = rows.map(r => PRODUCTS.find(p => p.id === r.product_id)).filter(Boolean);
  } catch (e) { /* 오프라인 등 — 아래에서 기본 문구로 대체 */ }
  // 기다리는 사이 검색어가 바뀌었으면 무시
  if (qRaw !== lastQuery || !document.getElementById("codewait")) return;
  if (hits.length) {
    $main.innerHTML = `<div class="rescount">"${esc(qRaw.trim())}" 수입 품번 검색결과 ${hits.length}개</div>` + grid(hits, 60);
  } else {
    document.getElementById("codewait").innerHTML =
      '검색 결과가 없습니다.<br>품번 철자를 확인해 보세요. 온라인몰에 없는 매장 전용 상품일 수도 있습니다.';
  }
}
window.renderSearchMore = () => {
  appendMore(doSearch(lastQuery), searchLimit, searchLimit + 60);
  searchLimit += 60;
};

function cardHtml(p) {
  const img = p._img
    ? `<img src="${esc(imgUrl(p._img, 300))}" loading="lazy" decoding="async" onload="this.classList.add('ld')" alt="">`
    : '<span class="noimg">이미지 없음</span>';
  const badge = p.storeOnly ? '<span class="store-badge">매장전용</span>'
    : (p.state === "SOLDOUT" ? '<span class="soldout-badge">품절</span>' : "");
  return `<div class="pcard" onclick='nav({view:"product",id:${esc(JSON.stringify(p.id))}})'>
    <div class="ph">${img}</div>
    <div class="nm">${badge}${esc(p.name)}</div>
    <div class="pr">${p.price ? p.price.toLocaleString() + "원" : ""}</div>
  </div>`;
}
// "더 보기": 화면 전체를 다시 그리지 않고 그리드 뒤에 새 카드만 붙인다(이미 뜬 사진 유지, 스크롤 안 튐)
function appendMore(items, from, to) {
  const g = $main.querySelector(".grid"), btn = $main.querySelector("button.more");
  if (!g) return;
  g.insertAdjacentHTML("beforeend", items.slice(from, to).map(cardHtml).join(""));
  if (btn) {
    if (items.length > to) btn.textContent = `더 보기 (${items.length - to}개 남음)`;
    else btn.remove();
  }
}
function grid(items, limit, moreCall) {
  let html = '<div class="grid">';
  for (const p of items.slice(0, limit)) html += cardHtml(p);
  html += "</div>";
  if (moreCall && items.length > limit) html += `<button class="more" onclick='${moreCall}'>더 보기 (${items.length - limit}개 남음)</button>`;
  return html;
}

/* ---------- 상세 ---------- */
// 스펙 표 행 순서 — 제품 코드가 항상 맨 위(정확한 제품명 바로 아래)
const SPEC_ORDER = ["제품 코드", "소재", "규격", "상세", "원산지", "제조년월", "설명"];
// 바코드가 하나뿐인 제품(의류 등 다옵션 제외)이면 스펙 표에 합칠 재고 행 정보를 만든다
function oneBcInfo(p) {
  if (p.storeOnly || p.colors.length !== 1 || p.colors[0].sizes.length !== 1) return null;
  const c = p.colors[0], s = c.sizes[0];
  if (!s.barcode) return null;
  const rawSz = (s.size === "XXX" || s.size === "FREE") ? "" : s.size;
  return { bc: s.barcode, lb: (c.color && c.color !== "단품" ? c.color + " · " : "") + (rawSz || "단일") };
}
function specHtml(spec, stk) {
  spec = spec || {};
  const keys = Object.keys(spec).sort((a, b) => {
    const ia = SPEC_ORDER.indexOf(a), ib = SPEC_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  const rows = keys.map(k => {
    let label = k, copyBtn = "";
    if (k === "제품 코드") {
      // 영문이 섞인 코드(의류 등)는 수입 품번 — 인트라넷/발주에서 쓰는 명칭
      if (/[A-Za-z]/.test(spec[k])) label = "수입 품번";
      copyBtn = `<button class="sbtn" onclick="copyText(${esc(JSON.stringify(spec[k]))}, '${label} 복사됨')">복사</button>`;
    }
    return `<div class="spec-row${copyBtn ? " coderow" : ""}"><span class="spec-k">${esc(label)}</span><span class="spec-v${k === "제품 코드" ? " mono" : ""}">${esc(spec[k])}</span>${copyBtn}</div>`;
  });
  if (stk) {
    // 재고 행은 제품 코드 바로 아래(코드 행이 없으면 맨 위)
    rows.splice(keys.indexOf("제품 코드") + 1, 0,
      `<div class="spec-row stkrow" data-bc="${esc(stk.bc)}">
        <span class="spec-k">재고</span>
        <span class="spec-v sz"><span class="mystk wait">확인 중…</span></span>
        <button class="sbtn stockbtn" data-bc="${esc(stk.bc)}" data-lb="${esc(stk.lb)}">재고</button>
      </div>`);
  }
  return `<div class="specbox" id="specbox"${rows.length ? "" : ' style="display:none"'}>${rows.join("")}</div>`;
}
// products/view 응답으로 스펙 표 보강 — products.json에 없는 제품 코드·제조년월·설명을 채우고,
// 사용상 주의는 길어서 표 아래에 접어 붙인다
function applyInfo(p, info) {
  if (!info) return;
  const box = document.getElementById("specbox");
  if (!box) return;
  const stk = oneBcInfo(p);
  const merged = Object.assign({}, p.spec);
  if (stk && !merged["제품 코드"]) merged["제품 코드"] = stk.bc;
  if (info.code) merged["제품 코드"] = info.code;
  if (info.maker) merged["제조년월"] = info.maker;
  if (info.content) merged["설명"] = info.content;
  if (Object.keys(merged).length || stk) {
    // 재고 칸은 loadMyStock이 병렬로 먼저 채웠을 수 있어 다시 그린 표에 상태를 옮겨 심는다
    const oldSz = box.querySelector(".stkrow .sz");
    box.outerHTML = specHtml(merged, stk);
    const newSz = document.querySelector("#specbox .stkrow .sz");
    if (oldSz && newSz) newSz.innerHTML = oldSz.innerHTML;
  }
  if (info.notice && !$detail.querySelector(".pnotice")) {
    const d = document.createElement("details");
    d.className = "pnotice";
    d.innerHTML = `<summary>사용상 주의사항</summary><div class="nbody">${esc(info.notice)}</div>`;
    document.getElementById("specbox").insertAdjacentElement("afterend", d);
  }
}
// 색상 하나의 사이즈·바코드 행들
function bcRowsHtml(p, c) {
  if (!c.sizes.length) return '<div class="warn" style="margin:0">바코드 정보 없음</div>';
  let h = "";
  for (const s of c.sizes) {
    // "XXX"·"FREE"는 API의 "사이즈 없음" 표시자 — 그대로 노출하면 깨진 글자처럼 보인다
    const rawSz = (s.size === "XXX" || s.size === "FREE") ? "" : s.size;
    const szLabel = rawSz ? esc(rawSz) : "단일";
    const st = s.state === "SOLDOUT" ? '<div class="st">품절</div>' : "";
    const stockLb = esc((c.color && c.color !== "단품" ? c.color + " · " : "") + (rawSz || "단일"));
    h += `<div class="bcrow" data-bc="${esc(s.barcode)}">
      <div class="sz">${szLabel}${st}${p.storeOnly ? "" : '<div class="mystk wait">…</div>'}</div>
      <div class="bc">${esc(s.barcode)}</div>
      ${p.storeOnly ? "" : `<button class="stockbtn" data-bc="${esc(s.barcode)}" data-lb="${stockLb}">재고</button>`}
      <button onclick="copyText('${esc(s.barcode)}', '바코드 복사됨')">복사</button>
    </div>`;
  }
  return h;
}
// 색상 칩 선택 — 해당 색상의 사이즈 행으로 교체하고 그 행들의 자점 재고를 불러온다
window.selColor = i => {
  const p = PRODUCTS.find(x => x.id === (history.state || {}).id);
  const rows = document.getElementById("sizerows");
  if (!p || !rows || !p.colors[i]) return;

  const title = document.getElementById("seltitle");
  if (title) title.textContent = p.colors[i].color === "단품" ? "기본" : p.colors[i].color;
  rows.innerHTML = bcRowsHtml(p, p.colors[i]);
  loadMyStock(p);
  // 갤러리 연동 — 해당 색상 사진 그룹으로 스크롤(접혀 있으면 펼침)

  if (galg) {

function openDetail(id) {

    : "") + "</div>";

  const stk = oneBcInfo(p);

        }).join("") +

        const title = c.color && c.color !== "단품" ? esc(c.color) : "기본";

  }
  // 외부 바로가기: 온라인몰 제품 페이지(안드로이드는 공식앱 우선) + 네이버 스토어 내 검색.
  // 매장 전용 상품은 온라인몰·네이버에 없으므로 생략. 네이버는 제품 ID 매핑이 없어 이름 검색으로 이동.

  $detail.innerHTML = html;

// 상세 화면의 각 바코드 행에 자점(내 매장) 재고를 자동 표시.
// 옵션마다 stores API 1회 — 100ms 간격 스태거 병렬(서버 배려), 세션 캐시(진행 중 프라미스) 재사용.
function fetchStores(oid) {
  if (!STOCK_CACHE[oid]) {
    STOCK_CACHE[oid] = (async () => {
      const res = await fetch(`${MUJI_API}/stores?product_option_id=${encodeURIComponent(oid)}&page=1`,
        { headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return (((await res.json()).data || {}).rows || []);
    })().catch(e => { delete STOCK_CACHE[oid]; throw e; });
  }
  return STOCK_CACHE[oid];
}
let stockRun = 0;  // 색상 전환 등으로 새 호출이 시작되면 이전 작업의 결과 반영은 중단
async function loadMyStock(p) {
  if (p.storeOnly) return;
  const run = ++stockRun;
  const store = myStore();
  let g = null;
  try { g = await fetchGallery(p.id); } catch (e) {}
  // .bcrow(색상·사이즈 블록)와 .stkrow(스펙 표의 재고 행) 둘 다 채운다.
  // 주의: 행 요소를 미리 붙잡아두면 안 된다 — 병렬로 도는 applyInfo가 스펙 표를 다시 그리면
  // 붙잡아둔 옛(분리된) 요소에 채우게 되고, 화면의 새 요소는 "확인 중…"으로 남아
  // 마지막 정리에서 "확인 불가"가 됐다(2026-08-19 수정). 채우는 시점에 바코드로 다시 찾는다.
  const bcs = [...$detail.querySelectorAll(".bcrow[data-bc], .stkrow[data-bc]")].map(el => el.dataset.bc);
  if (g && g.optMap) {
    await Promise.all(bcs.map(async (bc, i) => {
      const m = g.optMap[bc];
      if (!m) return;
      if (i && !STOCK_CACHE[m.oid]) await new Promise(r => setTimeout(r, i * 100));  // 스태거
      try {
        const list = await fetchStores(m.oid);
        // 다른 제품·다른 색상으로 넘어갔으면 반영하지 않는다(닫으면 history 상태가 먼저 바뀐다)
        if (run !== stockRun || (history.state || {}).id !== p.id) return;
        // 미리 그려둔 고정 높이 자리(.mystk.wait)의 내용만 바꾼다 — 행 높이가 안 변해 화면이 안 밀린다
        const mine = list.find(r => r.id === store.id);
        const rowEl = $detail.querySelector(`.bcrow[data-bc="${bc}"], .stkrow[data-bc="${bc}"]`);
        const slot = rowEl && rowEl.querySelector(".sz .mystk");
        if (slot && slot.classList.contains("wait")) {
          const n = mine ? (mine.usable_stock || 0) : null;
          slot.textContent = `${store.name} ${n === null ? "?" : (n ? n + "개" : "없음")}`;
          slot.classList.remove("wait");
          slot.classList.toggle("zero", !n);
        }
      } catch (e) {}  // 오프라인 등 — 아래에서 안내 처리(버튼으로는 재시도 가능)
    }));
  }
  // 못 채운 자리는 안내로 바꿔둔다(오프라인·옵션 매핑 실패 등). wait 클래스는 남겨 재시도 시 다시 채워진다.
  if (run === stockRun && (history.state || {}).id === p.id)

/* ---------- 상세 사진 전체(온라인몰 API에서 즉시 조회) ----------
   products.json에는 용량 때문에 색상당 대표 1장만 저장한다(전부 넣으면 25MB↑).
   상세를 열 때 products/view 를 호출해 색상별 사진 전체 + 상세페이지 이미지를 받아 교체.
   실패(오프라인 등)하면 이미 그려둔 대표 사진이 그대로 남는다. */
const GAL_CACHE = {};
const MUJI_API = "https://api.mujikorea.co.kr/api";
function uniqUrls(a) {
  const seen = new Set();
  return (a || []).filter(u => typeof u === "string" && u && !/no.?image/i.test(u) && !seen.has(u) && (seen.add(u), true));
}
// 같은 제품을 갤러리·재고가 동시에 요청해도 fetch는 1번만 가게 진행 중인 프라미스를 캐시한다
function fetchGallery(id) {
  if (!GAL_CACHE[id]) {
    GAL_CACHE[id] = fetchGalleryRaw(id).catch(e => { delete GAL_CACHE[id]; throw e; });
  }
  return GAL_CACHE[id];
}
async function fetchGalleryRaw(id) {
  const res = await fetch(`${MUJI_API}/products/view/${encodeURIComponent(id)}`, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const prod = (((await res.json()).data || {}).row || {}).product || {};
  const groups = [];
  const opts = prod.options;
  if (opts && typeof opts === "object") {
    for (const cname in opts) {
      const c = opts[cname];
      // 단일옵션(option_type=ONE) 응답에 섞이는 option_name(문자열)·data(null) 키는 건너뛴다
      if (!c || typeof c !== "object") continue;
      const list = uniqUrls(c.images);
      if (list.length) groups.push({ color: (cname || "").trim(), imgs: list });
    }
  }
  // 이미지 서버 No Image 함정: 옵션 사진이 자동 생성된 바코드 경로({바코드}_1260.jpg) 1장뿐인 제품은
  // 실제 업로드가 없어 플레이스홀더 그림이 뜬다(2026-08-19 확인, 예: 튼튼한 수납 박스 화이트그레이).
  // 이 경우 공식 제품 페이지 캐러셀(thumbnail_list)로 대체 — 진짜 사진 1장뿐인 제품이어도 같은 제품 사진이라 손해 없음.
  const thumbs = uniqUrls(prod.thumbnail_list);
  if (groups.length === 1 && groups[0].imgs.length === 1 &&
      /\/\d{10,14}_1260\.jpg$/i.test(groups[0].imgs[0]) && thumbs.length) {
    groups[0].imgs = thumbs;
  }
  if (!groups.length && thumbs.length) groups.push({ color: "", imgs: thumbs });
  // 바코드 → 옵션ID·재고 매핑(매장 재고 조회용). 색상형·단품형 구조가 달라 재귀로 수집.
  const optMap = {};
  (function scan(node) {
    if (!node || typeof node !== "object") return;
    if (Array.isArray(node)) { node.forEach(scan); return; }
    if (node.option_barcode && node.product_option_id) {
      optMap[node.option_barcode] = { oid: node.product_option_id, stock: node.stock, dc: node.muji_dc_stock };
    }
    for (const k in node) scan(node[k]);
  })(opts);
  GAL_CACHE[id] = {
    groups, detail: uniqUrls(prod.detail_images), optMap,
    // 스펙 표 보강용 추가 정보(제품 코드·제조년월·설명·사용상 주의)
    info: {
      code: (prod.code || "").trim(),
      maker: (prod.maker_at || "").trim(),
      content: (prod.content || "").trim(),
      notice: ((prod.notice1 || "") + (prod.notice2 ? "\n" + prod.notice2 : "")).trim(),
    },
  };
  return GAL_CACHE[id];
}
async function loadGallery(p) {
  let g;
  try { g = await fetchGallery(p.id); } catch (e) { return; }
  // 슬라이드 전환이 끝난 뒤에 갤러리를 갈아끼운다(전환 중 레이아웃 변경이 끊김의 원인)
  const wait = ($detail._openedAt || 0) + 280 - performance.now();
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  const box = document.getElementById("gal");
  if (!box) return;
  // 그리는 사이 다른 제품으로 넘어갔으면 무시.
  // (.open 클래스 검사는 안 씀 — 백그라운드 탭은 rAF·타이머가 늦어 fetch가 먼저 끝나면 조기 반환됐다)
  if ((history.state || {}).id !== p.id) return;
  applyInfo(p, g.info);
  const multi = g.groups.length > 1;
  const total = g.groups.reduce((n, x) => n + x.imgs.length, 0);
  if (total) {
    const grpHtml = (grp, gi) =>
      `<div class="galg" data-color="${esc(grp.color)}">${multi && grp.color ? `<div class="gall">${esc(grp.color)} · ${grp.imgs.length}장</div>` : ""}

      </div>`;
    // 색상이 많으면 제품명이 한참 아래로 밀리므로 3번째 색상부터는 접어둔다
    const head = g.groups.slice(0, 2).map(grpHtml).join("");
    const rest = g.groups.slice(2);
    box.innerHTML = head + (rest.length
      ? `<details class="galmore"><summary>다른 색상 사진 (${rest.length}개 색상)</summary>` +
        rest.map((grp, i) => grpHtml(grp, i + 2)).join("") + "</details>"
      : "") + `<div class="gal-load">사진 ${total}장 · 탭하면 크게 보입니다</div>`;
    box.querySelectorAll("details").forEach(eagerOnOpen);
    box.onclick = ev => {
      const el = ev.target.closest("img[data-g]");
      if (!el) return;
      openViewer(g.groups[+el.dataset.g].imgs, +el.dataset.i);
    };
  }
  // 상세 페이지 이미지(연출컷·설명·규격표)는 접어서 아래에 붙인다
  const body = $detail.querySelector(".d-body");
  if (g.detail.length && body && !body.querySelector(".dimgs")) {
    const d = document.createElement("details");
    d.className = "dimgs";
    // eager+낮은 우선순위: 접힌 상태에서도 미리 내려받아 펼치는 순간 바로 보이게 한다
    // (lazy는 접힌 details 안에서 로드가 시작되지 않아 펼친 뒤 한참 걸렸음)
    d.innerHTML = `<summary>상세 페이지 이미지 (${g.detail.length})</summary><div class="dbody">` +
      g.detail.map(u => `<img src="${esc(imgUrl(u, 800))}" loading="eager" fetchpriority="low" decoding="async" alt="">`).join("") + "</div>";
    const cats = body.querySelector(".d-cats");
    body.insertBefore(d, cats || null);
  }
}
// 접힌 <details> 안의 lazy 이미지는 펼쳐도 바로 로드되지 않는 경우가 있어, 펼칠 때 eager로 바꾼다

  lastScan = { code: null, t: 0, flash: 0 };  // 카드를 닫으면 같은 제품도 바로 다시 찍을 수 있게
}
window.srCopy = id => { const p = PRODUCTS.find(x => x.id === id); if (p) copyText(p.name, "제품명 복사됨"); };
// 스캔 결과 카드의 자점 재고 — 스캔한 바코드(=해당 색상·사이즈 옵션)의 내 매장 수량
async function srStock(p, code) {
  const store = myStore();
  let txt, zero;
  try {
    const g = await fetchGallery(p.id);
    const m = g.optMap && g.optMap[code];
    if (!m) throw new Error("옵션 없음");
    const rows = await fetchStores(m.oid);
    const mine = rows.find(r => r.id === store.id);
    const n = mine ? (mine.usable_stock || 0) : null;
    txt = `${store.name} ${n === null ? "?" : (n ? n + "개" : "재고 없음")}`;
    zero = !n;
  } catch (e) { txt = `${store.name} 재고 확인 불가`; zero = true; }
  const slot = document.getElementById("srstk");
  if (!slot || slot.dataset.code !== code) return;  // 그 사이 다른 스캔으로 카드가 바뀜
  slot.textContent = txt;
  slot.classList.remove("wait");
  slot.classList.toggle("zero", zero);
}
// 상세/검색으로 나갈 때: 다음 화면을 스캐너 뒤에서 먼저 그린 뒤 스캐너만 페이드아웃(크로스페이드)
window.srDetail = id => {
  scanHandled = true;
  nav({ view: "product", id });
  setTimeout(closeScanner, 240);
};
window.srSearch = code => {
  scanHandled = true;
  $q.value = code;
  $clearq.style.display = "block";
  history.pushState({}, "", "#");
  renderSearch(code);
  setTimeout(closeScanner, 240);
};
// 카메라 스트림·디코더 정지. srcObject는 그대로 둬서 마지막 프레임이 정지화면처럼 남는다.
function stopScanStream() {
  clearInterval(scanWatch); scanWatch = null;
  if (scanLoopStop) { scanLoopStop(); scanLoopStop = null; }
  if (scanControls) { try { scanControls.stop(); } catch (e) {} scanControls = null; }
  if (scanReader) {
    try { if (scanReader.stopContinuousDecode) scanReader.stopContinuousDecode(); } catch (e) {}
    try { scanReader.reset(); } catch (e) {}
    scanReader = null;
  }
  const v = document.getElementById("scanvideo");
  if (v && v.srcObject) { try { v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {} }
}
function closeScanner() {
  stopScanStream();
  const v = document.getElementById("scanvideo");
  if (v) { v.srcObject = null; v.classList.remove("on"); }
  const sc = document.getElementById("scanner");
  sc.classList.remove("open");
  sc.classList.remove("hit");
  hideScanResult();
}
// 앱이 백그라운드로 가거나 페이지를 떠날 때 카메라 정리
document.addEventListener("visibilitychange", () => { if (document.hidden) closeScanner(); });
window.addEventListener("pagehide", closeScanner);
</script>
