<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7f0019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MUJI 제품 찾기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --red: #7f0019;
    --bg: #f7f6f4;
    --card: #ffffff;
    --ink: #1c1c1c;
    --sub: #8a8681;
    --line: #e8e5e1;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 640px; margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .brand h1 { font-size: 17px; letter-spacing: -0.3px; }
  .brand h1 b { color: var(--red); }
  .brand .upd { font-size: 11px; color: var(--sub); }
  .searchwrap { position: relative; }
  #q {
    width: 100%; font-size: 16px; padding: 12px 40px 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--ink); outline: none;
  }
  #q:focus { border-color: var(--red); }
  #clearq {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; font-size: 18px; color: var(--sub);
    padding: 8px; display: none; cursor: pointer;
  }
  .hint { font-size: 11px; color: var(--sub); margin-top: 6px; }
  main { padding: 12px 16px 60px; }
  .loading { text-align: center; color: var(--sub); padding: 48px 0; font-size: 14px; }

  /* 카테고리 홈 */
  .cat-top {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px;
  }
  .cat-top button {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 12px; font-size: 15px; text-align: left; color: var(--ink); cursor: pointer;
  }
  .cat-top button span { display: block; font-size: 11px; color: var(--sub); margin-top: 3px; }
  .sec-title { font-size: 13px; color: var(--sub); margin: 18px 0 8px; }

  /* 하위 카테고리 */
  .crumb { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .crumb button.back {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 12px; font-size: 14px; cursor: pointer; color: var(--ink);
  }
  .crumb .path { font-size: 14px; color: var(--sub); }
  .leaf-group { margin-bottom: 14px; }
  .leaf-group h3 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 12px 0 6px; }
  .leaf-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .leaf-list button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 13px; font-size: 13.5px; cursor: pointer;
  }
  .leaf-list button b { color: var(--sub); font-weight: 400; font-size: 12px; }

  /* 제품 그리드 / 검색결과 */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pcard {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    /* 화면 밖 카드는 렌더링을 건너뛰어 긴 목록 스크롤·검색 타이핑이 가벼워진다 */
    content-visibility: auto; contain-intrinsic-size: auto 180px;
  }
  .pcard .ph { aspect-ratio: 1; background: #f0eeeb; display: flex; align-items: center; justify-content: center; }
  /* 사진이 뚝뚝 나타나지 않게: 로딩 완료 시 배경색에서 부드럽게 페이드인 */
  .pcard .ph img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s ease; }
  .pcard .ph img.ld { opacity: 1; }
  .pcard .ph .noimg { font-size: 11px; color: var(--sub); }
  .pcard .nm { font-size: 12px; padding: 7px 8px 2px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
  .pcard .pr { font-size: 12px; color: var(--sub); padding: 0 8px 8px; }
  .soldout-badge { display: inline-block; font-size: 10px; color: #fff; background: #b3aca4; border-radius: 4px; padding: 1px 5px; margin-right: 4px; vertical-align: 1px; }
  .store-badge { display: inline-block; font-size: 10px; color: #fff; background: var(--red); border-radius: 4px; padding: 1px 5px; margin-right: 4px; vertical-align: 1px; }
  .rescount { font-size: 13px; color: var(--sub); margin: 2px 0 10px; }
  .more { width: 100%; margin-top: 12px; padding: 12px; font-size: 14px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; cursor: pointer; color: var(--ink); }
  .empty { text-align: center; color: var(--sub); padding: 40px 12px; font-size: 14px; line-height: 1.6; }

  /* 상세 */
  #detail {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    max-width: 640px; margin: 0 auto; overflow-y: auto;
    padding-bottom: 40px;
    /* display 토글 대신 transform으로 오른쪽에서 밀려 들어오는 전환.
       visibility는 duration 보간(전환 중 visible, 끝나면 hidden)으로 처리 */
    visibility: hidden; transform: translateX(100%);
    transition: transform .22s ease, visibility .22s;
    will-change: transform; /* 슬라이드를 GPU 합성으로 처리해 끊김 방지 */
  }
  #detail.open { visibility: visible; transform: none; }
  .d-head { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 5; }
  .d-head button { border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; color: var(--ink); }
  .d-head span { font-size: 13px; color: var(--sub); }
  .d-body { padding: 16px; }
  .d-imgs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; }
  .d-imgs img { height: 150px; border-radius: 10px; border: 1px solid var(--line); background: #f0eeeb; cursor: zoom-in;
    min-width: 112px; opacity: 0; transition: opacity .25s ease; }
  .d-imgs img.ld { opacity: 1; }
  .galg { margin-bottom: 10px; }
  .galg .gall { font-size: 11.5px; color: var(--sub); margin: 0 2px 5px; }
  .galg .d-imgs { margin-bottom: 0; }
  .gal-load { font-size: 11.5px; color: var(--sub); margin: 0 2px 12px; }
  .galmore { margin-bottom: 6px; }
  .galmore > summary { font-size: 12.5px; color: var(--sub); cursor: pointer; padding: 6px 2px; }
  /* 상세 페이지 이미지(연출컷·설명·규격표) 접기 */
  .dimgs { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
  .dimgs > summary { padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .dimgs .dbody { padding: 0 10px 10px; }
  .dimgs .dbody img { width: 100%; border-radius: 8px; display: block; margin-bottom: 8px; background: #fff; }
  /* 사진 크게 보기 */
  #viewer { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.93);
    opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  #viewer.open { opacity: 1; pointer-events: auto; }
  #viewer .vstrip { height: 100%; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
  #viewer .vstrip > div { flex: 0 0 100%; height: 100%; scroll-snap-align: center;
    display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
  #viewer .vstrip img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .vclose { position: absolute; top: 12px; right: 12px; z-index: 2; border: 0; border-radius: 999px;
    width: 42px; height: 42px; font-size: 18px; background: rgba(255,255,255,.92); cursor: pointer; }
  #viewer .vcnt { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .namebox {
    background: var(--card); border: 1.5px solid var(--red); border-radius: 12px;
    padding: 14px; margin-bottom: 8px;
  }
  .namebox .lbl { font-size: 11px; color: var(--red); font-weight: 700; margin-bottom: 5px; }
  .namebox .nm { font-size: 17px; font-weight: 700; line-height: 1.45; word-break: keep-all; user-select: all; }
  .namebox .pr { font-size: 13px; color: var(--sub); margin-top: 5px; }
  .copybtn {
    margin-top: 10px; width: 100%; padding: 11px; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 10px; background: var(--red); color: #fff; cursor: pointer;
  }
  .warn { font-size: 11.5px; color: var(--sub); margin: 8px 2px 16px; line-height: 1.5; }
  .colorblock { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .colorblock .ctitle { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .colorblock .ctitle img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); }
  .bcrow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 2px; border-top: 1px dashed var(--line); gap: 8px;
  }
  .bcrow .sz { font-size: 13.5px; min-width: 44px; }
  .bcrow .sz .st { color: #b0473a; font-size: 11px; }
  .bcrow .bc {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 16.5px; letter-spacing: 0.5px; user-select: all;
  }
  .bcrow button {
    border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
    padding: 7px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink); flex-shrink: 0;
  }
  .d-cats { font-size: 12px; color: var(--sub); margin-top: 14px; line-height: 1.6; }

  /* 제품 상세정보 (소재·규격·원산지) */
  .specbox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 2px 14px; margin-bottom: 10px; }
  .spec-row { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .spec-row:first-child { border-top: 0; }
  .spec-k { flex-shrink: 0; width: 52px; color: var(--sub); font-weight: 600; }
  .spec-v { flex: 1; line-height: 1.55; word-break: keep-all; user-select: all; }

  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; font-size: 14px; padding: 11px 20px;
    border-radius: 999px; opacity: 0; transition: all .2s; z-index: 99; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { text-align: center; font-size: 11px; color: var(--sub); padding: 24px 16px; line-height: 1.6; }
  /* 관리자 입구: footer 맨 아래 흐린 점 하나(누르는 영역은 넉넉히) */
  footer .adminlink { display: inline-block; padding: 10px 16px; color: var(--line); cursor: pointer; user-select: none; }
  .crumb .edu-lockmark { margin-left: auto; font-size: 15px; opacity: .5;
    border: 0; background: none; padding: 6px 8px; cursor: pointer; }
  /* 본문 화면 전환: 살짝 떠오르는 페이드 */
  @keyframes viewin { from { opacity: 0; transform: translateY(6px); } }
  #main.vin { animation: viewin .16s ease; }
  @media (prefers-reduced-motion: reduce) {
    #main.vin { animation: none; }
    #detail, #detail.open, #viewer, #scanner, #scanner video, #scanresult { transition: none; }
  }

  /* 탭 */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    flex: 1; padding: 9px 0; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--sub);
  }
  .tabs button.on { background: var(--red); border-color: var(--red); color: #fff; }

  /* 교육자료 */
  .edu-card {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 8px; cursor: pointer;
  }
  .edu-card .t { font-size: 15px; font-weight: 700; color: var(--ink); }
  .edu-card .d { font-size: 12.5px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
  .doc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; line-height: 1.7; }
  .doc h2 { font-size: 19px; margin: 4px 0 12px; }
  .doc h3 { font-size: 15.5px; margin: 18px 0 8px; color: var(--red); }
  .doc h4 { font-size: 14px; margin: 14px 0 6px; }
  .doc p { font-size: 14px; margin: 8px 0; }
  .doc ul, .doc ol { font-size: 14px; padding-left: 22px; margin: 8px 0; }
  .doc li { margin: 4px 0; }
  .doc li.chk { list-style: none; margin-left: -20px; }
  .doc blockquote { border-left: 3px solid var(--line); padding: 2px 12px; color: var(--sub); font-size: 13px; margin: 10px 0; }
  .doc hr { border: 0; border-top: 1px dashed var(--line); margin: 16px 0; }
  .doc-img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line);
    border-radius: 8px; margin: 12px 0; }
  .doc-img-sm { display: block; max-width: 220px; width: 100%; height: auto; border: 1px solid var(--line);
    border-radius: 8px; margin: 8px 0; }
  .doc-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
  .doc-table th, .doc-table td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
  .doc-table th { background: var(--bg); font-weight: 700; }
  .doc-plink { color: var(--red); font-weight: 600; text-decoration: none;
    border-bottom: 1px solid var(--red); cursor: pointer; }
  .doc-link { color: var(--red); }
  .doc-table td .doc-plink { white-space: nowrap; }
  .doc-code { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px;
    letter-spacing: 0.3px; user-select: all; }
  .doc-prow { display: flex; align-items: center; gap: 11px; padding: 8px 2px;
    border-top: 1px dashed var(--line); cursor: pointer; }
  .doc-prow:active { background: var(--bg); }
  .doc-prow img, .doc-prow-noimg { width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 8px; border: 1px solid var(--line); object-fit: cover; background: #f0eeeb; }
  .doc-prow-tx { min-width: 0; }
  .doc-prow-nm { font-size: 13.5px; line-height: 1.35; color: var(--ink); font-weight: 600; }
  .doc-prow .doc-code { color: var(--sub); font-size: 12px; }
  .doc-prow-pr { color: var(--sub); font-family: inherit; }

  /* 접기 블록 */
  .doc-fold { border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; background: var(--card); }
  .doc-fold > summary { padding: 13px 14px; font-size: 15px; font-weight: 700; color: var(--ink);
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
  .doc-fold > summary::before { content: "▸"; color: var(--red); font-size: 13px; transition: transform .15s; }
  .doc-fold[open] > summary::before { transform: rotate(90deg); }
  .doc-fold > summary::-webkit-details-marker { display: none; }
  .doc-fold-body { padding: 0 14px 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .doc-table td { line-height: 1.5; }

  /* 교육자료 카테고리 */
  .edu-group { margin-bottom: 6px; }
  .edu-cat { font-size: 12.5px; color: var(--red); font-weight: 700; margin: 16px 2px 7px;
    display: flex; align-items: center; gap: 6px; }
  .edu-cat::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .edu-cat b { font-weight: 400; color: var(--sub); font-size: 11.5px; }

  /* 교육자료 검색 */
  .edu-search { width: 100%; font-size: 15px; padding: 10px 12px; border: 1.5px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink); outline: none; margin-bottom: 10px; }
  .edu-search:focus { border-color: var(--red); }

  /* 교육자료 편집 */
  .edu-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .edu-adminchip { margin-left: auto; border: 1px solid var(--line); background: var(--card); color: var(--sub);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; cursor: pointer; }
  .edu-add { border: 1px solid var(--red); background: var(--red); color: #fff; border-radius: 10px;
    padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .crumb .edu-edit { margin-left: auto; border: 1px solid var(--line); background: var(--card); color: var(--red);
    border-radius: 10px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .eduform { display: flex; flex-direction: column; gap: 4px; }
  .eduform label { font-size: 12.5px; color: var(--sub); font-weight: 600; margin: 10px 2px 2px; }
  .eduform input, .eduform textarea {
    width: 100%; font-size: 15px; padding: 11px 12px; border: 1.5px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink); outline: none;
    font-family: inherit; -webkit-appearance: none;
  }
  .eduform textarea { line-height: 1.6; resize: vertical; }
  .eduform input:focus, .eduform textarea:focus { border-color: var(--red); }
  /* 비밀번호 입력: 👁 버튼으로 입력 내용 확인 */
  .pwwrap { position: relative; }
  .pwwrap input { padding-right: 48px; box-sizing: border-box; }
  .pwwrap .pweye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; font-size: 17px; padding: 8px 10px; cursor: pointer; opacity: .55; }
  footer .ver { opacity: .6; }
  .eduform-btns { display: flex; gap: 8px; margin-top: 14px; }
  .edu-save { flex: 1; border: 0; background: var(--red); color: #fff; border-radius: 10px;
    padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .edu-draft-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px;
    padding: 13px 18px; font-size: 14px; cursor: pointer; }
  .edu-del { border: 1px solid var(--line); background: var(--card); color: #b0473a; border-radius: 10px;
    padding: 13px 18px; font-size: 14px; cursor: pointer; }
  .edu-draft { background: #fbf3e6; border: 1px solid #e8d8b8; border-radius: 10px; padding: 10px 12px;
    font-size: 12.5px; color: #7a5a1e; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .edu-draft button { border: 1px solid #d8c090; background: #fff; color: #7a5a1e; border-radius: 8px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; }

  /* 검색줄 + 스캔 버튼 */
  .searchrow { display: flex; gap: 8px; align-items: stretch; }
  .searchrow .searchwrap { flex: 1; }
  #scanbtn {
    flex-shrink: 0; width: 48px; border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--red); font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #scanbtn:active { background: var(--bg); }

  /* 바코드 스캐너 오버레이 */
  #scanner {
    position: fixed; inset: 0; z-index: 80; background: #000;
    display: flex; flex-direction: column;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .25s ease, visibility .25s;
  }
  #scanner.open { opacity: 1; visibility: visible; pointer-events: auto; }
  /* 카메라가 켜지면 검은 화면에서 영상으로 부드럽게 */
  #scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .3s ease; }
  #scanner video.on { opacity: 1; }
  .scan-head {
    position: relative; z-index: 3; display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background: linear-gradient(#000c, #0000); color: #fff;
  }
  .scan-head button { border: 1px solid #fff6; background: #0006; color: #fff;
    border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .scan-head span { font-size: 13px; color: #fff; opacity: .9; }
  .scan-mask { position: absolute; inset: 0; z-index: 1;
    background: #00000073; pointer-events: none; }
  .scan-frame {
    position: relative; z-index: 2; margin: auto; width: 74%; max-width: 320px; aspect-ratio: 1.4;
    border: 2px solid #fff; border-radius: 14px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

<script>
"use strict";
// 홈 footer에 표시되는 앱 버전. 배포할 때마다 올린다 — 폰에서 옛 버전 캐시가 남았는지 확인용.
const APP_VER = "2026-08-19.12";

/* ---------- Firebase (교육자료 실시간 공유) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCyCF1S8V3KKnUGw3NQnoiLviCYy0iJEss",
  authDomain: "muji-finder.firebaseapp.com",

};
let fb = null;   // { db, fs } — Firestore, 지연 초기화
let EDU = null;  // 교육자료 문서 캐시
async function initFirebase() {
  if (fb) return fb;
  const [appMod, fs] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"),
  ]);
  const app = appMod.initializeApp(firebaseConfig);
  fb = { db: fs.getFirestore(app), fs };

}
async function loadEdu(key) {
  const { db, fs } = await initFirebase();
  const snap = await fs.getDocs(fs.query(fs.collection(db, "edu"), fs.orderBy("order")));
  const out = [];
  for (const d of snap.docs) {
    const data = d.data();
    try {
      const dec = await decryptObj(key, data);  // { title, desc, body } 또는 { type:"img", ... }
      if (dec.type === "img") continue;         // 분리 저장 이미지는 목록에서 숨김
      out.push({ id: d.id, order: data.order, ...dec });
    } catch (e) {
      out.push({ id: d.id, order: data.order, title: "🔒 열 수 없음", desc: "현재 비밀번호로 복호화 안 됨", body: "", _locked: true });
    }
  }
  EDU = out;
  return EDU;
}
// 문서 렌더 후 data-eimg 이미지들을 개별 문서에서 복호화해 채운다(캐시 사용)
const EIMG_CACHE = {};
async function hydrateEduImages(root, skipFolded) {
  let imgs = [...(root || document).querySelectorAll("img[data-eimg]")];
  if (skipFolded) imgs = imgs.filter(el => !el.closest(".doc-fold") || el.closest(".doc-fold").open);
  if (!imgs.length) return;
  const key = await ensureEduKey();
  if (!key) return;
  const { db, fs } = await initFirebase();
  for (const el of imgs) {
    const id = el.getAttribute("data-eimg");
    el.removeAttribute("data-eimg");
    try {
      if (!EIMG_CACHE[id]) {
        const snap = await fs.getDoc(fs.doc(db, "edu", id));
        if (!snap.exists()) continue;
        const dec = await decryptObj(key, snap.data());
        EIMG_CACHE[id] = dec.src;
      }
      el.src = EIMG_CACHE[id];
    } catch (e) {}
  }
}
// 교육자료 비밀번호: 코드엔 SHA-256 해시만(원문 없음). 검증 겸 암호화 키 유도에 사용.
// 회사 문서가 들어가므로 내용은 AES-256으로 암호화해 Firestore에 저장한다.
// 비밀번호를 잃으면 기존 내용은 복구 불가(모두 재작성 필요) — 비밀번호를 안전히 공유·보관할 것.
const EDU_PW_HASH = "02f3c8e9896c0ab95e98c3fce2a3e058a23b3904b6f1ec8460f1d329835aca11";
// 관리자 모드: 잠금(lock) 표시된 교육자료는 관리자 비밀번호를 입력한 기기에서만 수정·삭제 가능.
// 입구는 홈 화면 footer 맨 아래의 흐린 "·" (일반 직원 눈에 잘 안 띄게). 코드엔 해시만.
const EDU_ADMIN_HASH = "96f5087044481c2dd820d3e0838e76c3aa22f24a8b893bf715a04fba2737cda7";
function isAdmin() { return localStorage.getItem("eduAdmin") === "1"; }
// 비밀번호 입력칸의 👁: 입력 내용을 보이게/숨기게 전환(오타 확인용)
function togglePw(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;

}
function pwField(id, placeholder) {
  return `<div class="pwwrap">
    <input id="${id}" type="password" placeholder="${placeholder}" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
    <button type="button" class="pweye" onclick="togglePw('${id}', this)" aria-label="비밀번호 표시">👁</button>

}
function renderAdminPw() {
  // 홈 footer(제품 찾기 탭)와 잠긴 문서의 🔒(교육자료 탭) 양쪽에서 들어오므로 탭 표시는 바꾸지 않는다
  if (isAdmin()) {
    $main.innerHTML = `<div class="crumb"><button class="back" onclick="history.back()">← 뒤로</button><span class="path">관리자</span></div>
      <div class="eduform">
        <div class="warn" style="margin:4px 2px">이 기기는 관리자 모드입니다. 잠금(🔒) 자료를 수정·삭제할 수 있습니다.</div>
        <div class="eduform-btns"><button class="edu-del" id="adminOffBtn">관리자 모드 끄기</button></div>
      </div>`;
    document.getElementById("adminOffBtn").addEventListener("click", () => {
      localStorage.removeItem("eduAdmin"); toast("관리자 모드 해제됨"); history.back();
    });
    return;
  }
  $main.innerHTML = `<div class="crumb"><button class="back" onclick="history.back()">← 뒤로</button><span class="path">관리자</span></div>
    <div class="eduform">
      <label>관리자 비밀번호</label>
      ${pwField("adminPw", "비밀번호")}
      <div class="eduform-btns"><button class="edu-save" id="adminPwBtn">확인</button></div>
    </div>`;
  const inp = document.getElementById("adminPw");
  const go = async () => {
    const pw = (inp.value || "").trim().toLowerCase();
    if (await sha256hex(pw) === EDU_ADMIN_HASH) {
      localStorage.setItem("eduAdmin", "1");
      toast("관리자 모드 켜짐");
      history.back();
    } else toast("비밀번호가 맞지 않습니다");

  document.getElementById("adminPwBtn").addEventListener("click", go);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  setTimeout(() => inp.focus(), 50);
}
let eduKey = null;  // 유도된 AES-GCM 키(메모리 캐시)
async function sha256hex(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function eduAuthed() { return !!sessionStorage.getItem("eduPw"); }
async function deriveKey(password) {
  const e = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", e.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: e.encode("muji-edu-salt-v1"), iterations: 100000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function ensureEduKey() {
  if (eduKey) return eduKey;
  const pw = sessionStorage.getItem("eduPw");
  if (!pw) return null;
  eduKey = await deriveKey(pw);
  return eduKey;
}
function b64(buf) {
  // 큰 데이터(이미지 포함 문서)에서 스택 초과 방지 위해 청크 단위로 변환
  const bytes = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}
function ub64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer; }
async function encryptObj(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { enc: b64(ct), iv: b64(iv) };
}
async function decryptObj(key, doc) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(doc.iv) }, key, ub64(doc.enc));
  return JSON.parse(new TextDecoder().decode(pt));
}

let DB = null;          // 전체 데이터
let PRODUCTS = [];      // 검색 인덱스 포함 제품 배열
let CATTREE = {};       // top -> mid -> [{leafPath, count}]
const $main = document.getElementById("main");
const $detail = document.getElementById("detail");
const $q = document.getElementById("q");
const $clearq = document.getElementById("clearq");

/* ---------- 한글 유틸 ---------- */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function chosung(str) {
  let out = "";
  for (const ch of str) {
    const c = ch.codePointAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) out += CHO[Math.floor((c - 0xAC00) / 588)];
    else out += ch;
  }
  return out;
}
// 검색 비교용 정규화: 공백·중점·괄호류 제거 + 소문자
function norm(str) {
  return (str || "").toLowerCase().replace(/[\sㆍㆍ··()\[\]\-_,./]/g, "");
}
function isChosungQuery(s) { return /^[ㄱ-ㅎ]+$/.test(s); }

/* ---------- 데이터 로드 ---------- */
// products.json(온라인 수집) + extra.json(매장 전용 수동 등록)을 함께 읽어 합친다.
Promise.all([
  fetch("./data/products.json").then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  fetch("./data/extra.json").then(r => r.ok ? r.json() : []).catch(() => []),
]).then(([db, extra]) => init(db, extra))
  .catch(e => {
    $main.innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.<br>' + e + "</div>";
  });

// extra.json의 간단한 항목을 앱 내부 제품 구조로 변환
function extraToProduct(item, i) {
  const bc = (item.barcode || "").trim();
  return {
    id: "x" + i,
    name: item.name || "(이름 없음)",
    price: item.price || null,
    state: "ON",
    cats: [item.cat && item.cat.trim() ? item.cat.trim() : "매장 전용 상품"],
    colors: [{
      color: "단품", img: null, imgs: [],
      sizes: bc ? [{ size: "", barcode: bc, state: "ON" }] : [],
    }],
    storeOnly: true,
  };
}

function init(db, extra) {
  DB = db;
  const extraProducts = (Array.isArray(extra) ? extra : []).map(extraToProduct);
  const allProducts = db.products.concat(extraProducts);
  const totalCount = db.count + extraProducts.length;
  document.getElementById("upd").textContent = db.updated + " 기준 · " + totalCount.toLocaleString() + "개";
  PRODUCTS = allProducts.map(p => {
    const barcodes = [];
    for (const c of p.colors) for (const s of c.sizes) barcodes.push(s.barcode);
    return {
      ...p,
      _n: norm(p.name),
      _c: chosung(norm(p.name)),
      _b: barcodes.join(" "),
      _img: firstImg(p),
    };
  });
  buildCatTree();
  route();
  // 스캐너 라이브러리(360KB)를 한가할 때 미리 받아둔다 → 첫 스캔부터 카메라가 빨리 뜬다
  if (navigator.mediaDevices && window.isSecureContext) {
    setTimeout(() => loadZxing().catch(() => {}), 2500);
  }
}
function firstImg(p) {
  // 실제 제품 사진(imgs)을 우선하고, 없을 때만 색상 칩(img·원단 확대컷)을 쓴다
  for (const c of p.colors) if (c.imgs && c.imgs[0]) return c.imgs[0];
  for (const c of p.colors) if (c.img) return c.img;
  return null;
}
function buildCatTree() {
  CATTREE = {};
  for (const p of PRODUCTS) {
    for (const cat of p.cats) {
      const parts = cat.split(" > ");
      const top = parts[0] || "기타";
      const mid = parts.length >= 3 ? parts[1] : (parts[1] || "전체");
      if (!CATTREE[top]) CATTREE[top] = {};
      if (!CATTREE[top][mid]) CATTREE[top][mid] = {};
      if (!CATTREE[top][mid][cat]) CATTREE[top][mid][cat] = 0;
      CATTREE[top][mid][cat]++;
    }
  }
}

/* ---------- 라우팅 (뒤로가기 지원) ---------- */
window.addEventListener("popstate", route);
function nav(state) { history.pushState(state, "", "#"); route(); }
function route() {
  const s = history.state || {};
  // 사진 크게 보기가 열려 있으면 뒤로가기는 그것만 닫는다(상세 화면은 그대로 유지)
  if (VIEWER_OPEN) {
    closeViewer();
    if (!s.viewer && s.view === "product" && $detail.classList.contains("open")) return;
  }
  closeDetail();
  // 본문 화면이 바뀔 때 짧은 페이드 전환(제품 상세는 오버레이가 자체 슬라이드)

    $main.classList.remove("vin"); void $main.offsetWidth; $main.classList.add("vin");
  }
  if (s.view === "admin") { renderAdminPw(); return; }
  if (s.view === "edu") { renderEduList(); return; }
  if (s.view === "edudoc") { renderEduDoc(s.id); return; }
  if (s.view === "eduedit") { renderEduEdit(s.id); return; }
  setTab("find");
  if (s.view === "product") { openDetail(s.id); return; }
  if (s.view === "cat") { renderCat(s.top); return; }
  if (s.view === "leaf") { renderLeaf(s.leaf); return; }
  if ($q.value.trim()) { renderSearch($q.value); return; }
  renderHome();
}
function setTab(which) {
  document.getElementById("tabFind").classList.toggle("on", which === "find");
  document.getElementById("tabEdu").classList.toggle("on", which === "edu");
  const show = which === "find" ? "" : "none";

function goTab(which) {

  else { history.pushState({}, "", "#"); route(); }
}

/* ---------- 교육자료 (Firebase 실시간 공유) ---------- */
function renderEduList() {
  setTab("edu");
  ensureEduKey().then(key => {
    if (!key) { renderEduPw("list"); return; }
    const render = docs => {
      const head = '<div class="edu-head"><div class="sec-title" style="margin:0">교육자료</div>' +
        // 관리자 모드일 때만 보이는 상태 버튼 — 누르면 관리자 화면(끄기 버튼 있음)으로
        (isAdmin() ? '<button class="edu-adminchip" onclick=\'nav({view:"admin"})\'>🔓 관리자 켜짐</button>' : '') +
        '<button class="edu-add" onclick=\'nav({view:"eduedit",id:""})\'>+ 새 자료</button></div>' +
        (docs.length ? '<input class="edu-search" id="eduSearch" type="search" placeholder="교육자료 검색 (제목·내용)" autocomplete="off">' : '');
      $main.innerHTML = head + '<div id="eduListArea"></div>' +
        '<footer>🔒 내용은 암호화되어 저장됩니다. 비밀번호를 아는 직원만 열람·편집할 수 있어요.</footer>';
      const area = document.getElementById("eduListArea");
      const card = d => `<button class="edu-card" onclick='nav({view:"edudoc",id:${JSON.stringify(d.id)}})'>
          <div class="t">${esc(d.title)}</div><div class="d">${esc(d.desc || "")}</div></button>`;
      const drawCards = q => {
        const nq = norm(q);
        // 제목·설명·본문 전체에서 검색(공백 무시). 본문까지 뒤져 원하는 내용 바로 찾기.

// 최소한의 마크다운 변환: 제목/목록/체크리스트/인용/굵게/구분선/링크
// 링크는 두 가지: [이름](p:바코드) = 앱 안에서 제품 상세 열기, [이름](https://…) = 새 탭
function md2html(src) {
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(p:(\d{8,14})\)/g,
      '<a class="doc-plink" href="#" onclick="openByBarcode(\'$2\');return false;">$1</a>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a class="doc-link" href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let html = "", list = null, para = [], table = [];
  const flushPara = () => { if (para.length) { html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const flushList = () => { if (list) { html += "</" + list + ">"; list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|?[\s|:\-]+\|?$/.test(r));  // 구분선(|---|) 제외
    let h = '<table class="doc-table">';
    rows.forEach((row, i) => {
      const cells = row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const tag = i === 0 ? "th" : "td";
      h += "<tr>" + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
    });
    html += h + "</table>"; table = [];
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushAll(); continue; }
    if (line.trim().startsWith("|")) { flushPara(); flushList(); table.push(line.trim()); continue; }
    if (table.length) flushTable();
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
      flushPara(); flushList();
      const tag = ["h2", "h3", "h4"][m[1].length - 1];
      html += `<${tag}>${inline(m[2])}</${tag}>`;
    } else if (/^---+$/.test(line.trim())) {
      flushPara(); flushList(); html += "<hr>";
    } else if ((m = line.match(/^@p\s+(\d{8,14})(?:\s+(.+))?$/))) {
      // 제품 행: "@p 바코드 [표시이름]" → 썸네일+이름+코드 카드(누르면 상세).
      // 표시이름을 주면 공통 접두를 뺀 짧은 이름으로 보여줄 수 있다(정식 명칭은 상세에서).
      flushPara(); flushList();
      const bc = m[1];
      const prod = (typeof PRODUCTS !== "undefined") &&
        PRODUCTS.find(x => x.colors.some(c => c.sizes.some(s => s.barcode === bc)));
      const nm = (m[2] || "").trim() || (prod ? prod.name : "(앱 데이터에 없는 제품)");
      const im = prod && prod._img ? `<img src="${esc(imgUrl(prod._img, 100))}" loading="lazy" alt="">` : '<span class="doc-prow-noimg"></span>';
      const pr = prod && prod.price ? ` · ${prod.price.toLocaleString()}원` : "";
      html += `<div class="doc-prow" onclick="openByBarcode('${bc}')">${im}
        <div class="doc-prow-tx"><div class="doc-prow-nm">${esc(nm)}</div><div class="doc-code">${bc}<span class="doc-prow-pr">${pr}</span></div></div></div>`;
    } else if ((m = line.match(/^\+\+\+\s*(.*)$/))) {
      // 접기 블록: "+++ 제목"으로 열고 "+++" 단독 줄로 닫는다. 긴 문서를 최소화해 보여줄 때 사용
      flushAll();
      if (m[1].trim()) html += `<details class="doc-fold"><summary>${inline(m[1].trim())}</summary><div class="doc-fold-body">`;
      else html += "</div></details>";
    } else if ((m = line.match(/^!\[([^\]]*)\]\(eimg:([A-Za-z0-9]+)\)\s*$/))) {
      // 분리 저장된 암호화 이미지: 본문 크기 제한을 피해 별도 문서에 담긴 이미지를 지연 로드
      flushPara(); flushList();
      html += `<img class="doc-img" data-eimg="${esc(m[2])}" alt="${esc(m[1])}">`;
    } else if ((m = line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/))) {
      // 이미지 한 줄: ![설명](url). alt가 "sm:"로 시작하면 작은 참고 이미지
      flushPara(); flushList();
      const sm = m[1].startsWith("sm:");
      html += `<img class="${sm ? "doc-img-sm" : "doc-img"}" src="${esc(m[2])}" alt="${esc(m[1].replace(/^sm:/, ""))}" loading="lazy">`;
    } else if ((m = line.match(/^>\s?(.*)/))) {
      flushPara(); flushList(); html += "<blockquote>" + inline(m[1]) + "</blockquote>";
    } else if ((m = line.match(/^[-*]\s+\[( |x|X)\]\s+(.*)/))) {
      flushPara(); if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; }
      const box = m[1].trim() ? "☑" : "☐";
      html += `<li class="chk">${box} ${inline(m[2])}</li>`;
    } else if ((m = line.match(/^[-*]\s+(.*)/))) {
      flushPara(); if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; }
      html += "<li>" + inline(m[1]) + "</li>";
    } else if ((m = line.match(/^\d+\.\s+(.*)/))) {
      flushPara(); if (list !== "ol") { flushList(); html += "<ol>"; list = "ol"; }
      html += "<li>" + inline(m[1]) + "</li>";
    } else {
      flushList(); para.push(line);
    }
  }
  flushAll();
  return html;
}

function doSearch(qRaw) {
  // 공백으로 나눈 단어들을 모두 포함(AND)하는 제품을 찾는다.
  // 단어별로: 숫자 → 바코드, 초성만 → 초성 매칭, 그 외 → 제품명(공백 무시) 매칭
  const tokens = qRaw.trim().split(/\s+/).map(norm).filter(Boolean);
  if (!tokens.length) return [];
  const results = [];
  for (const p of PRODUCTS) {
    let score = 0, ok = true;
    for (const t of tokens) {
      let idx;
      if (/^\d{4,}$/.test(t)) idx = p._b.indexOf(t);
      else if (isChosungQuery(t)) idx = p._c.indexOf(t);
      else idx = p._n.indexOf(t);
      if (idx < 0) { ok = false; break; }
      score += idx;
    }
    if (ok) results.push([score, p]);
  }
  results.sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length);
  return results.map(r => r[1]);
}

function cardHtml(p) {

    : (p.state === "SOLDOUT" ? '<span class="soldout-badge">품절</span>' : "");
  return `<div class="pcard" onclick='nav({view:"product",id:${JSON.stringify(p.id)}})'>
    <div class="ph">${img}</div>

// "더 보기": 화면 전체를 다시 그리지 않고 그리드 뒤에 새 카드만 붙인다(이미 뜬 사진 유지, 스크롤 안 튐)
function appendMore(items, from, to) {
  const g = $main.querySelector(".grid"), btn = $main.querySelector("button.more");
  if (!g) return;
  g.insertAdjacentHTML("beforeend", items.slice(from, to).map(cardHtml).join(""));
  if (btn) {
    if (items.length > to) btn.textContent = `더 보기 (${items.length - to}개 남음)`;
    else btn.remove();
  }
}
function grid(items, limit, moreCall) {
  let html = '<div class="grid">';
  for (const p of items.slice(0, limit)) html += cardHtml(p);
  html += "</div>";
  if (moreCall && items.length > limit) html += `<button class="more" onclick='${moreCall}'>더 보기 (${items.length - limit}개 남음)</button>`;
  return html;
}

/* ---------- 상세 사진 전체(온라인몰 API에서 즉시 조회) ----------
   products.json에는 용량 때문에 색상당 대표 1장만 저장한다(전부 넣으면 25MB↑).
   상세를 열 때 products/view 를 호출해 색상별 사진 전체 + 상세페이지 이미지를 받아 교체.
   실패(오프라인 등)하면 이미 그려둔 대표 사진이 그대로 남는다. */
const GAL_CACHE = {};
const MUJI_API = "https://api.mujikorea.co.kr/api";
function uniqUrls(a) {
  const seen = new Set();
  return (a || []).filter(u => typeof u === "string" && u && !/no.?image/i.test(u) && !seen.has(u) && (seen.add(u), true));
}
async function fetchGallery(id) {
  if (GAL_CACHE[id]) return GAL_CACHE[id];
  const res = await fetch(`${MUJI_API}/products/view/${encodeURIComponent(id)}`, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const prod = (((await res.json()).data || {}).row || {}).product || {};
  const groups = [];
  const opts = prod.options;
  if (opts && typeof opts === "object") {
    for (const cname in opts) {
      const c = opts[cname];
      // 단일옵션(option_type=ONE) 응답에 섞이는 option_name(문자열)·data(null) 키는 건너뛴다
      if (!c || typeof c !== "object") continue;
      const list = uniqUrls(c.images);
      if (list.length) groups.push({ color: (cname || "").trim(), imgs: list });
    }
  }
  if (!groups.length) {
    const t = uniqUrls(prod.thumbnail_list);
    if (t.length) groups.push({ color: "", imgs: t });
  }
  GAL_CACHE[id] = { groups, detail: uniqUrls(prod.detail_images) };
  return GAL_CACHE[id];
}
async function loadGallery(p) {
  let g;
  try { g = await fetchGallery(p.id); } catch (e) { return; }
  // 슬라이드 전환이 끝난 뒤에 갤러리를 갈아끼운다(전환 중 레이아웃 변경이 끊김의 원인)
  const wait = ($detail._openedAt || 0) + 280 - performance.now();
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  const box = document.getElementById("gal");
  if (!box || !$detail.classList.contains("open")) return;
  // 그리는 사이 다른 제품으로 넘어갔으면 무시
  if ((history.state || {}).id !== p.id) return;
  const multi = g.groups.length > 1;
  const total = g.groups.reduce((n, x) => n + x.imgs.length, 0);
  if (total) {
    const grpHtml = (grp, gi) =>
      `<div class="galg">${multi && grp.color ? `<div class="gall">${esc(grp.color)} · ${grp.imgs.length}장</div>` : ""}
        <div class="d-imgs">${grp.imgs.map((u, i) =>
          `<img src="${esc(imgUrl(u, 400))}" loading="lazy" decoding="async" onload="this.classList.add('ld')" alt="" data-g="${gi}" data-i="${i}">`).join("")}</div>
      </div>`;
    // 색상이 많으면 제품명이 한참 아래로 밀리므로 3번째 색상부터는 접어둔다
    const head = g.groups.slice(0, 2).map(grpHtml).join("");
    const rest = g.groups.slice(2);
    box.innerHTML = head + (rest.length
      ? `<details class="galmore"><summary>다른 색상 사진 (${rest.length}개 색상)</summary>` +
        rest.map((grp, i) => grpHtml(grp, i + 2)).join("") + "</details>"
      : "") + `<div class="gal-load">사진 ${total}장 · 탭하면 크게 보입니다</div>`;
    box.querySelectorAll("details").forEach(eagerOnOpen);
    box.onclick = ev => {
      const el = ev.target.closest("img[data-g]");
      if (!el) return;
      openViewer(g.groups[+el.dataset.g].imgs, +el.dataset.i);
    };
  }
  // 상세 페이지 이미지(연출컷·설명·규격표)는 접어서 아래에 붙인다
  const body = $detail.querySelector(".d-body");
  if (g.detail.length && body && !body.querySelector(".dimgs")) {
    const d = document.createElement("details");
    d.className = "dimgs";
    d.innerHTML = `<summary>상세 페이지 이미지 (${g.detail.length})</summary><div class="dbody">` +
      g.detail.map(u => `<img src="${esc(imgUrl(u, 800))}" loading="lazy" decoding="async" alt="">`).join("") + "</div>";
    eagerOnOpen(d);
    const cats = body.querySelector(".d-cats");
    body.insertBefore(d, cats || null);
  }
}
// 접힌 <details> 안의 lazy 이미지는 펼쳐도 바로 로드되지 않는 경우가 있어, 펼칠 때 eager로 바꾼다
function eagerOnOpen(det) {
  det.addEventListener("toggle", () => {
    if (det.open) det.querySelectorAll('img[loading="lazy"]').forEach(im => { im.loading = "eager"; });
  });
}
/* 사진 크게 보기 — 좌우로 넘기며 보고, 뒤로가기(또는 ✕)로 닫는다 */

/* ---------- 복사 & 토스트 ---------- */
function copyText(text, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("복사 실패 - 길게 눌러 복사하세요"); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// 무인양품 이미지 서버는 ?w=로 리사이즈를 지원한다. 원본은 수백 KB~수 MB라
// 그리드 썸네일에 그대로 쓰면 매우 느리다. 용도별 크기로 축소해 대역폭을 아낀다.
function imgUrl(url, w) {
  if (!url || url.indexOf("product.mujikorea.co.kr") === -1) return url;
  return url + (url.indexOf("?") >= 0 ? "&" : "?") + "w=" + w;
}

/* ---------- 바코드 카메라 스캔 ---------- */
// @zxing/library(vendor/zxing.min.js) 사용 — iOS 사파리 포함 모든 브라우저에서 동작.
// 라이브러리(약 360KB)는 스캔 버튼을 처음 누를 때만 로드해 초기 로딩엔 부담이 없다.
let scanControls = null, scanReader = null, zxingLoading = null, scanHandled = false;
function loadZxing() {
  if (window.ZXing) return Promise.resolve();
  if (zxingLoading) return zxingLoading;
  zxingLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "./vendor/zxing.min.js";
    s.onload = resolve;
    s.onerror = () => { zxingLoading = null; reject(new Error("스캐너 로드 실패")); };
    document.head.appendChild(s);
  });
  return zxingLoading;
}
async function openScanner() {
  // 카메라는 보안 컨텍스트(https 또는 localhost)에서만 열림
  if (!navigator.mediaDevices || !window.isSecureContext) {
    toast("카메라는 https 주소에서만 됩니다"); return;
  }
  scanHandled = false;
  const sc = document.getElementById("scanner");
  document.getElementById("scanmsg").textContent = "카메라 켜는 중…";
  sc.classList.add("open");
  const video = document.getElementById("scanvideo");
  // 첫 프레임이 나오면 검은 화면에서 영상으로 페이드인
  video.addEventListener("loadeddata", () => video.classList.add("on"), { once: true });
  // 해상도는 처음부터 2560×1440으로 요청한다. (720p로 시작해 나중에 올리는 방식을
  // 실험했으나: 시작 속도는 그대로 1~2초였고, 안드로이드 크롬은 켜진 트랙의 해상도를
  // 처음 연 값 이상으로 못 올려 화질만 떨어졌다 → 되돌림. 남는 1~2초는 카메라 하드웨어 기동 시간.)
  const constraints = { video: { facingMode: "environment", width: { ideal: 2560 }, height: { ideal: 1440 } } };
  // 카메라와 zxing 라이브러리를 "동시에" 준비 — 카메라가 먼저 되면 화면부터 띄운다
  // (예전엔 라이브러리 로드가 끝나야 카메라를 요청해서 화면이 늦게 떴다)
  const zxingP = loadZxing();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    closeScanner();
    toast(e && e.name === "NotAllowedError" ? "카메라 권한을 허용해 주세요" : "카메라를 열 수 없습니다");
    return;
  }
  if (!sc.classList.contains("open")) { stream.getTracks().forEach(t => t.stop()); return; }  // 기다리다 닫은 경우
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  tuneCameraFocus(video);  // 근접 초점 개선(연속 초점) — 인식 준비와 무관하게 바로
  try {
    await zxingP;
  } catch (e) {
    closeScanner(); toast("스캐너를 불러오지 못했습니다"); return;
  }
  if (!sc.classList.contains("open")) return;
  // 무인양품 바코드는 EAN-13(JAN). 포맷을 좁혀 인식 속도를 높인다.
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.CODE_128,
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  scanReader = new ZXing.BrowserMultiFormatReader(hints);
  const onResult = result => { if (result) handleScanCode((result.getText() || "").trim()); };
  try {
    if (typeof scanReader.decodeFromStream === "function") {
      // 이미 켜둔 카메라 스트림에 인식기만 붙인다(카메라 재시작 없음)
      scanControls = await scanReader.decodeFromStream(stream, video, onResult);
    } else {
      // 구버전 폴백: 스트림을 끄고 기존 방식으로 재요청
      stream.getTracks().forEach(t => t.stop());
      scanControls = await scanReader.decodeFromConstraints(constraints, video, onResult);
      tuneCameraFocus(video);
    }
  } catch (e) {
    closeScanner();
    toast("카메라를 열 수 없습니다");
  }
}
// 카메라 트랙에 연속 자동초점을 적용해 근접 바코드가 또렷하게 잡히도록 한다(지원 기기 한정)
async function tuneCameraFocus(video) {
  try {
    const stream = video.srcObject;
    const track = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
    if (!track || !track.getCapabilities || !track.applyConstraints) return;
    const caps = track.getCapabilities();
    if (caps.focusMode && caps.focusMode.includes("continuous")) {
      await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
    }
    const st = track.getSettings ? track.getSettings() : {};
    document.getElementById("scanmsg").textContent =
      "바코드를 인식하면 자동으로 제품을 찾습니다" + (st.width ? " (" + st.width + "×" + st.height + ")" : "");
  } catch (e) {}
}
/* 연속 스캔: 인식해도 카메라를 끄지 않고 하단 결과 카드만 띄운다.
   카드에서 제품명 복사·상세 보기가 되고, 그대로 다음 제품을 바로 찍을 수 있다
   (카메라 기동 1~2초를 매번 내지 않아도 됨). */
let lastScan = { code: null, t: 0 };
function handleScanCode(code) {
  if (scanHandled) return;                    // 상세/검색으로 전환 중엔 무시
  if (!/^\d{8,14}$/.test(code)) return;
  const now = Date.now();
  // 같은 바코드를 계속 비추고 있을 때 카드가 반복해서 뜨지 않게 쿨다운
  if (code === lastScan.code && now - lastScan.t < 2500) { lastScan.t = now; return; }
  lastScan = { code, t: now };
  onScanned(code);
}
function onScanned(code) {
  if (navigator.vibrate) navigator.vibrate(80);
  const sc = document.getElementById("scanner");
  sc.classList.add("hit");                     // 초록 프레임 반짝
  setTimeout(() => sc.classList.remove("hit"), 450);
  const hit = PRODUCTS.find(p => p.colors.some(c => c.sizes.some(s => s.barcode === code)));
  const el = document.getElementById("scanresult");
  if (hit) {
    const img = hit._img ? `<img src="${esc(imgUrl(hit._img, 100))}" alt="">` : "";
    el.innerHTML = `<div class="sr-top">${img}<div class="sr-tx"><div class="sr-nm">${esc(hit.name)}</div>
      <div class="sr-sub">${hit.price ? hit.price.toLocaleString() + "원 · " : ""}${esc(code)}</div></div>
      <button class="sr-x" onclick="hideScanResult()">✕</button></div>
      <div class="sr-btns"><button onclick='srCopy(${JSON.stringify(hit.id)})'>제품명 복사</button>
      <button class="pri" onclick='srDetail(${JSON.stringify(hit.id)})'>상세 보기</button></div>`;
  } else {
    el.innerHTML = `<div class="sr-top"><div class="sr-tx"><div class="sr-nm">일치 제품 없음</div>
      <div class="sr-sub">${esc(code)}</div></div>
      <button class="sr-x" onclick="hideScanResult()">✕</button></div>
      <div class="sr-btns"><button class="pri" onclick='srSearch(${JSON.stringify(code)})'>이 번호로 검색</button></div>`;
  }
  el.classList.add("show");
}
function hideScanResult() {
  document.getElementById("scanresult").classList.remove("show");
  lastScan = { code: null, t: 0 };  // 카드를 닫으면 같은 제품도 바로 다시 찍을 수 있게
}
window.srCopy = id => { const p = PRODUCTS.find(x => x.id === id); if (p) copyText(p.name, "제품명 복사됨"); };
// 상세/검색으로 나갈 때: 다음 화면을 스캐너 뒤에서 먼저 그린 뒤 스캐너만 페이드아웃(크로스페이드)
window.srDetail = id => {
  scanHandled = true;
  nav({ view: "product", id });
  setTimeout(closeScanner, 240);
};
window.srSearch = code => {
  scanHandled = true;
  $q.value = code;
  $clearq.style.display = "block";
  history.pushState({}, "", "#");
  renderSearch(code);
  setTimeout(closeScanner, 240);
};
// 카메라 스트림·디코더 정지. srcObject는 그대로 둬서 마지막 프레임이 정지화면처럼 남는다.
function stopScanStream() {
  if (scanControls) { try { scanControls.stop(); } catch (e) {} scanControls = null; }
  if (scanReader) { try { scanReader.reset(); } catch (e) {} scanReader = null; }
  const v = document.getElementById("scanvideo");
  if (v && v.srcObject) { try { v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {} }
}
function closeScanner() {
  stopScanStream();
  const v = document.getElementById("scanvideo");
  if (v) { v.srcObject = null; v.classList.remove("on"); }
  const sc = document.getElementById("scanner");
  sc.classList.remove("open");
  sc.classList.remove("hit");
  hideScanResult();
}
// 앱이 백그라운드로 가거나 페이지를 떠날 때 카메라 정리
document.addEventListener("visibilitychange", () => { if (document.hidden) closeScanner(); });
window.addEventListener("pagehide", closeScanner);
</script>
</body>
</html>
